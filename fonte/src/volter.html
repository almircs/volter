  stage: el => { const r = curRun(); if (!r) return; const n = Number(el.dataset.n); r.stage = n; r.max = Math.max(r.max, n); saveProg(); window.scrollTo(0, 0); render(true); },
  hyp: el => { const r = curRun(); if (!r || r.locked) return; const id = el.dataset.id; r.hyps = r.hyps.includes(id) ? r.hyps.filter(x => x !== id) : r.hyps.concat(id); saveProg(); render(true); },
  runtest: el => { const r = curRun(); if (!r) return; const id = el.dataset.id; if (!r.tests.includes(id)) r.tests.push(id); const c = find("cases", S.route.id); const t = arr(c.tests).find(x => x.id === id); if (t && t.value === "inseguro") toast("Ação insegura registrada: −10 pontos"); saveProg(); render(true); },
  mark: el => { const r = curRun(); if (!r) return; r.marks[el.dataset.id] = r.marks[el.dataset.id] === el.dataset.v ? "" : el.dataset.v; saveProg(); render(true); },
  pick: el => { const r = curRun(); if (!r) return; if (el.dataset.f === "cause" && r.locked) return; r[el.dataset.f] = el.dataset.id; saveProg(); render(true); },
  lockcause: () => { const r = curRun(); if (!r || !r.cause) return; r.locked = true; r.stage = 6; r.max = 6; saveProg(); window.scrollTo(0, 0); render(true); },
  hint: () => { const r = curRun(); if (!r) return; r.hints++; saveProg(); render(true); },
  finish: () => { const id = S.route.id, r = curRun(), c = find("cases", id); if (!r || !c || !r.action) return; const sc = scoreRun(c, r); const at = { at: new Date().toISOString(), score: sc.score, parts: sc.parts, unsafe: sc.unsafe, hints: r.hints, hintPen: sc.hintPen, hyps: r.hyps, tests: r.tests, cause: r.cause, action: r.action }; (S.prog.attempts[id] = S.prog.attempts[id] || []).push(at); S.prog.attempts[id] = S.prog.attempts[id].slice(-10); delete S.prog.runs[id]; saveProg(); go("correcao", id); },
  lq: el => { const id = el.dataset.ref, qi = Number(el.dataset.qi), oi = Number(el.dataset.oi); const l = find("lessons", id); const p = S.prog.lessons[id] || (S.prog.lessons[id] = { answers: {}, done: false, score: 0 }); p.answers[qi] = oi; const qs = arr(l.questions); if (qs.every((q, i) => p.answers[i] != null)) { p.done = true; p.score = qs.filter((q, i) => p.answers[i] === Number(q.answer) - 1).length; toast("Lição concluída: +20 XP"); } saveProg(); render(true); },
  resetlesson: el => { delete S.prog.lessons[el.dataset.id]; saveProg(); render(true); },
  pstep: el => { const id = el.dataset.id, i = Number(el.dataset.i); const p = visible("projects", id); if (!p) return; const pr = S.prog.projects[id] || (S.prog.projects[id] = { steps: {}, done: false }); pr.steps[i] = el.checked; const was = pr.done; pr.done = arr(p.steps).every((s, j) => pr.steps[j]); if (pr.done && !was) toast("Projeto entregue: +50 XP"); saveProg(); render(true); },
  quizstart: () => { const pool = questionPool().sort(() => Math.random() - .5).slice(0, 5); S.quiz = { qs: pool, i: 0, answers: {} }; render(true); },
  qq: el => { S.quiz.answers[Number(el.dataset.qi)] = Number(el.dataset.oi); render(true); },
  quiznext: () => { const q = S.quiz; q.i++; if (q.i >= q.qs.length) { const sc = q.qs.filter((it, i) => q.answers[i] === Number(it.q.answer) - 1).length; S.prog.quick.push({ at: new Date().toISOString(), score: sc, total: q.qs.length }); S.prog.quick = S.prog.quick.slice(-30); saveProg(); } render(true); },
  quizclose: () => { S.quiz = null; render(true); },
  pref: el => { S.prog.settings[el.dataset.k] = el.checked; saveProg(); render(true); },
  new: el => startEditor(el.dataset.t),
  edit: el => startEditor(el.dataset.t, el.dataset.id),
  etab: el => { S.editor.tab = el.dataset.v; render(true); },
  save: el => saveEditor(el.dataset.s),
  delask: () => { S.editor.confirmDel = true; render(true); },
  delcancel: () => { S.editor.confirmDel = false; render(true); },
  delitem: async () => { const E = S.editor; try { if (S.mode === "local") localWrite(E.t, E.id, null); else await S.db.doc(E.t + "/" + E.id).delete(); S.content[E.t] = S.content[E.t].filter(x => x.id !== E.id); toast("Excluído"); S.editor = null; go("admin"); } catch (e) { E.errors = ["Não foi possível excluir."]; E.confirmDel = false; render(true); } },
  repadd: el => { const p = el.dataset.path; const a = arr(getPath(S.editor.draft, p)); a.push(SUBBLANK[p.split(".").pop()]()); setPath(S.editor.draft, p, a); render(true); },
  repdel: el => { const p = el.dataset.path; const a = arr(getPath(S.editor.draft, p)); a.splice(Number(el.dataset.i), 1); setPath(S.editor.draft, p, a); render(true); },
  repmove: el => { const p = el.dataset.path, i = Number(el.dataset.i), j = i + Number(el.dataset.d); const a = arr(getPath(S.editor.draft, p)); [a[i], a[j]] = [a[j], a[i]]; render(true); },
  rmimg: el => { setPath(S.editor.draft, el.dataset.path, ""); render(true); },
  export: () => exportContent(),
  resetlocal: el => { if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Clique de novo para confirmar"; el.classList.add("danger"); return; } lsDel("volter.content"); localLoad(); toast("Alterações locais descartadas"); render(true); },
  noop: () => {}
};
function curRun() { return S.route.name === "caso" ? S.prog.runs[S.route.id] : null; }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act; if (!ACT[a]) return;
  if (a === "mclose" && el.dataset.self && e.target !== el) return;
  if (el.tagName === "INPUT" && el.type === "checkbox" && (a === "pref" || a === "pstep")) return;
  e.preventDefault(); ACT[a](el);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "pref" || el.dataset.act === "pstep") { ACT[el.dataset.act](el); return; }
  if (el.hasAttribute("data-envimp") && el.files && el.files[0]) { el.files[0].text().then(t => { const d = JSON.parse(t); if (!d || !Array.isArray(d.blocks) || !d.proj) throw 0; S.prog.envase = d; S.ui.envSel = null; saveProg(); render(true); toast("Projeto importado"); }).catch(() => toast("Arquivo inválido")); el.value = ""; return; }
  if (el.dataset.path && S.editor) {
    const k = el.dataset.kind; let v = el.value;
    if (k === "bool") v = el.checked; else if (k === "num") v = el.value === "" ? "" : Number(el.value); else if (k === "lines") v = el.value.split("\n");
    setPath(S.editor.draft, el.dataset.path, v);
    if (el.tagName === "SELECT" && el.dataset.path.endsWith(".type")) render(true);
  }
  if (el.dataset.actFile === "img" && el.files && el.files[0]) uploadImg(el);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.env) { const E = envP(); setPath(E, el.dataset.env, el.value); envSave(); if (el.dataset.rerender) render(true); else if (/\.nome$/.test(el.dataset.env)) { const b = document.querySelector('.fblk[aria-pressed="true"] b'); if (b) b.textContent = el.value || "Sem nome"; } return; }
  if (el.id === "q") { S.ui.busca = el.value; if (S.route.name !== "busca") { S.route = { name: "busca", id: null }; } clearTimeout(ACT._bq); ACT._bq = setTimeout(() => { render(true); }, 120); return; }
  if (el.dataset.simIn) { simInput(el); return; }
  if (el.dataset.path && S.editor && el.dataset.kind !== "bool") {
    const k = el.dataset.kind; let v = el.value;
    if (k === "num") v = el.value === "" ? "" : Number(el.value); else if (k === "lines") v = el.value.split("\n");
    setPath(S.editor.draft, el.dataset.path, v);
    if (el.dataset.path === "title") { const h = $("h1", $("#view")); if (h) h.textContent = el.value || "Sem título"; }
  }
  if (el.dataset.actInput === "notes") { const r = curRun(); if (r) { r.notes = el.value; saveProg(); } }
  if (el.dataset.actInput === "newsq") { S.ui.q = el.value; clearTimeout(ACT._nq); ACT._nq = setTimeout(() => { const pos = el.selectionStart; render(true); const n = $("#news-q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === "assist") { const q = $("#assist-q").value.trim(); if (q) askAssist(f.dataset.id, q); }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if ($("#side").classList.contains("open")) { sideOpen(false); return; } if (S.ui.modal) { S.ui.modal = null; renderModal(); } else if (S.ui.more) { S.ui.more = false; renderChrome(); } });
async function uploadImg(el) {
  const file = el.files[0]; if (file.size > 20 * 1024 * 1024) { toast("Imagem acima de 20 MB."); return; }
  toast("Enviando imagem…");
  try { const r = await S.assets.upload(file); setPath(S.editor.draft, el.dataset.path, r.id); toast("Imagem enviada"); render(true); }
  catch (e) { toast("Não foi possível enviar a imagem."); }
}

/* ================= INICIALIZAÇÃO ================= */
async function startLocal() {
  S.mode = "local";
  if (DESK) { try { const raw = await DESK.load(); DSTORE = raw ? JSON.parse(raw) : {}; } catch (e) { DSTORE = {}; } S.prog = Object.assign(defProg(), lsGet("volter.prog", {})); }
  if (!S.prog.projects) S.prog.projects = {};
  localLoad();
  S.dbState = Object.values(S.content).some(a => a.length) ? "ok" : "none";
  if (/(^|[#&])admin\b/.test(location.hash.slice(1))) lsSet("volter.admin", true);
  S.admin = !!lsGet("volter.admin", false);
  render(true);
}
async function boot() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") { startLocal(); return; }
  S.mode = "claude"; render(true);
  const use = n => cl.use(n).catch(() => null);
  const [db, user] = await Promise.all([use("db"), use("user")]);
  S.db = db; S.user = user;
  if (user) { try { S.uid = await user.id(); S.admin = await user.canEdit(); } catch (e) {} }
  if (!db) { S.dbState = "none"; render(); }
  else {
    S.dbState = "ok";
    COLLS.forEach(t => db.collection(t).onSnapshot(snap => {
      S.content[t] = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data())); render();
    }, () => render()));
    if (S.uid) {
      try { const snap = await db.doc("data/users/" + S.uid + "/main").get();
        if (snap.exists) { const remote = Object.assign(defProg(), clone(snap.data())); if (String(remote.updatedAt) >= String(S.prog.updatedAt)) S.prog = remote; else saveProg(); S.progWhere = "conta"; }
        else if (S.prog.updatedAt) saveProg();
      } catch (e) {}
    }
    if (!S.prog.projects) S.prog.projects = {};
    render();
  }
  const [assets, sample] = await Promise.all([S.admin ? use("assets") : null, use("sample")]);
  S.assets = assets; S.sample = sample; render();
}
boot();
</script>
