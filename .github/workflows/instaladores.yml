name: Gerar instaladores

# Roda sozinho a cada envio para a branch main (quando o programa muda)
# ou manualmente pela aba Actions. Os instaladores vão direto para a
# página "Releases" do repositório, sem passar pelo armazenamento de
# artefatos do GitHub Actions (que tem limite de espaço por conta).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'data/**'
      - 'main.js'
      - 'preload.js'
      - 'package.json'
      - 'build/**'

permissions:
  contents: write

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.versao.outputs.tag }}
      nova: ${{ steps.pagina.outputs.nova }}
    steps:
      - uses: actions/checkout@v4
      - id: versao
        run: echo "tag=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pagina
        name: Preparar a página da versão
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.versao.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Versão já existe: atualiza o texto e substitui os arquivos depois.
            gh release edit "$TAG" --notes-file .github/notas-da-versao.md
            echo "nova=nao" >> "$GITHUB_OUTPUT"
          else
            # Versão nova: cria como rascunho e só publica quando os instaladores estiverem prontos.
            gh release create "$TAG" --draft --target "$GITHUB_SHA" \
              --title "Volter ${TAG#v}" --notes-file .github/notas-da-versao.md
            echo "nova=sim" >> "$GITHUB_OUTPUT"
          fi

  windows:
    needs: preparar
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Gerar instalador do Windows
        run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Enviar para a página da versão
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preparar.outputs.tag }}
        run: |
          cp dist/*.exe "Instalar-Volter-Windows.exe"
          gh release upload "$TAG" "Instalar-Volter-Windows.exe" --clobber

  mac:
    needs: preparar
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Montar o app para Mac (Intel e chip Apple)
        run: npx electron-builder --mac dir --x64 --arm64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - name: Assinar (ad-hoc) e compactar
        run: |
          for d in dist/mac dist/mac-arm64; do
            app="$d/Volter.app"
            codesign --force --deep --sign - "$app"
            codesign --verify --deep "$app"
          done
          ditto -c -k --keepParent dist/mac-arm64/Volter.app "Volter-Mac-chip-Apple-M1-a-M4.zip"
          ditto -c -k --keepParent dist/mac/Volter.app "Volter-Mac-Intel.zip"
      - name: Enviar para a página da versão
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preparar.outputs.tag }}
        run: gh release upload "$TAG" "Volter-Mac-chip-Apple-M1-a-M4.zip" "Volter-Mac-Intel.zip" --clobber

  publicar:
    needs: [preparar, windows, mac]
    if: needs.preparar.outputs.nova == 'sim'
    runs-on: ubuntu-latest
    steps:
      - name: Publicar a versão
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preparar.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
