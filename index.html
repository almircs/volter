<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%221%22 y=%221%22 width=%2230%22 height=%2230%22 rx=%228%22 fill=%22%23181818%22/%3E%3Cpath d=%22M8.5 9 L16 24 L23.5 9%22 fill=%22none%22 stroke=%22%23e8202a%22 stroke-width=%223.2%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%228.5%22 cy=%229%22 r=%222.4%22 fill=%22%23b69cff%22/%3E%3Ccircle cx=%2223.5%22 cy=%229%22 r=%222.4%22 fill=%22%235cc8ff%22/%3E%3Ccircle cx=%2216%22 cy=%2224%22 r=%222.4%22 fill=%22%234fe3a6%22/%3E%3Ccircle cx=%2216%22 cy=%229%22 r=%222.4%22 fill=%22%23ffcb5c%22/%3E%3C/svg%3E">
<title>Volter</title>
<meta name="description" content="Volter — IA prática para quem trabalha: IA no dia a dia, automação, programação e dados.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: cabeçalho fixo que começa transparente sobre o destaque e fica sólido ao rolar; páginas em largura total com margem lateral de 4%;
   o início é um destaque grande seguido de fileiras horizontais de capas. Identidade: sala escura, vermelho do Volter e uma cor por trilha nas capas. */
:root{
  --bg:#0f0f10; --bg-2:#000; --surface:#181818; --surface-2:#262626; --line:#2b2b2b; --line-2:#3d3d3d;
  --ink:#f5f5f1; --muted:#b3b3b3; --dim:#808080;
  --primary:#ffffff; --primary-ink:#0f0f10; --focus:#ffffff;
  --red:#e8202a; --red-2:#b3141c;
  --ia:#b69cff; --prog:#5cc8ff; --dados:#ffcb5c; --iot:#4fe3a6; --agentes:#ff8f5c; --profissao:#ff7eb6; --seguranca:#4fe3a6; --carreira:#d4e157;
  --ok:#46d369; --warn:#ffb35c; --bad:#ff6b6b;
  --code-bg:#0a0a0a;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --gut:max(16px,4vw); --hdr:68px; --tab-h:62px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:800;line-height:1.06;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:2.6rem} h2{font-size:1.6rem} h3{font-size:1.15rem;font-weight:700} h4{font-size:1rem}
p{margin:0}
a{color:#fff}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.88rem}
.label{font-size:.84rem;color:var(--muted);font-weight:500}
.lvl-t,.ok-t{color:var(--ok);font-weight:600}
code,.mono{font-family:var(--f-mono);font-size:.9em}
:not(pre) > code{background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px}

/* trilhas */
[data-t="ia"]{--t:var(--ia)} [data-t="prog"]{--t:var(--prog)} [data-t="dados"]{--t:var(--dados)} [data-t="iot"]{--t:var(--iot)} [data-t="agentes"]{--t:var(--agentes)} [data-t="profissao"]{--t:var(--profissao)} [data-t="seguranca"]{--t:var(--seguranca)} [data-t="carreira"]{--t:var(--carreira)} [data-t="red"]{--t:var(--red)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--t,var(--muted));flex-shrink:0;display:inline-block}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:.84rem;color:var(--t,var(--muted));font-weight:500;white-space:nowrap}
.vmark{display:inline-block;width:11px;height:14px;background:var(--red);clip-path:polygon(0 0,30% 0,50% 60%,70% 0,100% 0,63% 100%,37% 100%);flex-shrink:0}

/* ===== cabeçalho ===== */
.hdr{position:fixed;top:0;left:0;right:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background-color:transparent;background-image:linear-gradient(180deg,rgba(0,0,0,.78) 0%,rgba(0,0,0,.3) 65%,rgba(0,0,0,0) 100%);transition:background-color .35s}
.hdr.solid{background-color:var(--bg)}
.hdr-in{height:var(--hdr);display:flex;align-items:center;gap:28px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:9px;background:none;border:0;cursor:pointer;color:#fff;padding:0;flex-shrink:0}
.brand svg{width:30px;height:30px}
.brand b{font-family:var(--f-display);font-weight:900;font-stretch:88%;font-size:1.5rem;letter-spacing:-.01em}
.hnav{display:flex;gap:20px;align-items:center;min-width:0;overflow-x:auto;scrollbar-width:none}
.hnav::-webkit-scrollbar{display:none}
.hnav button{background:none;border:0;color:#e5e5e5;font-size:.92rem;cursor:pointer;padding:6px 0;white-space:nowrap;transition:color .2s}
.hnav button:hover{color:var(--muted)}
.hnav button[aria-current="page"]{color:#fff;font-weight:700}
.hright{margin-left:auto;display:flex;align-items:center;gap:16px;flex-shrink:0}
.icon-btn{background:none;border:0;color:#fff;cursor:pointer;padding:4px;display:grid;place-items:center}
.icon-btn svg{width:22px;height:22px}
.icon-btn[aria-current="page"]{color:var(--red)}
.prof{display:flex;align-items:center;gap:10px;background:none;border:0;color:#fff;cursor:pointer;padding:0}
.avatar{width:32px;height:32px;border-radius:4px;background:conic-gradient(from 210deg,var(--ia),var(--prog),var(--dados),var(--iot),var(--ia));display:grid;place-items:center;font-family:var(--f-display);font-weight:900;color:#0f0f10;font-size:1rem}
.prof-txt{display:flex;flex-direction:column;line-height:1.15;text-align:left}
.prof-txt b{font-size:.84rem} .prof-txt span{font-size:.74rem;color:var(--muted)}
main{display:flex;flex-direction:column;gap:30px;max-width:1500px;padding-top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 30px);padding-bottom:40px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
main.full{max-width:none;padding-top:0;padding-left:0;padding-right:0;gap:0}
.gut{padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.page-top{padding-top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 30px);display:flex;flex-direction:column;gap:20px}
.foot{margin-top:40px;padding-top:22px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
main.full .foot{margin-left:max(var(--gut),env(safe-area-inset-left,0px));margin-right:max(var(--gut),env(safe-area-inset-right,0px))}
.foot .link{color:var(--muted);font-weight:400}
.snav{display:flex;flex-direction:column;gap:2px}
.snav .grp{font-size:.76rem;color:var(--dim);padding:12px 10px 4px;font-weight:500}
.snav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--muted);padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left;font-size:.95rem;width:100%}
.snav button svg{width:18px;height:18px;flex-shrink:0}
.snav button[aria-current="page"]{color:#fff;background:var(--surface-2)}
.snav .count{margin-left:auto;font-size:.76rem;color:var(--dim)}
.tabbar,.sheet{display:none}
@media (max-width:980px){
  .hnav,.prof-txt{display:none}
  .hdr-in{gap:14px}
  .brand b{font-size:1.3rem}
  main{padding-bottom:calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px));gap:22px}
  main.full{padding-bottom:calc(var(--tab-h) + 24px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:14;background:rgba(10,10,10,.96);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:.7rem;cursor:pointer;min-height:var(--tab-h)}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:#fff}
  .sheet{display:block;position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:14;background:#141414;border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));box-shadow:0 -16px 40px rgba(0,0,0,.6)}
  h1{font-size:2rem}
}

/* ===== componentes ===== */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:1120px){.split{grid-template-columns:1fr}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .lead{max-width:62ch;color:var(--muted);margin-top:10px;font-size:1.02rem}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:.88rem;margin-bottom:12px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.panel > h3:first-child{margin-bottom:14px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ph h3{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:transparent;color:var(--ink);padding:8px 15px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.92rem;text-decoration:none;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}
.btn.primary:hover{background:#ffffff}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 11px;font-size:.84rem;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;line-height:1.55}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.chip.go{border-color:color-mix(in srgb,var(--prog) 50%,transparent);color:var(--prog)}
.chip.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.chip.demo{border-style:dashed}
.chip.st-review{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)} .chip.st-published{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)} .chip.st-archived{border-style:dashed}
.lvl{display:inline-flex;gap:2px;align-items:flex-end;vertical-align:middle}
.lvl i{width:4px;background:var(--line-2);border-radius:1px}
.lvl i:nth-child(1){height:5px}.lvl i:nth-child(2){height:7px}.lvl i:nth-child(3){height:9px}.lvl i:nth-child(4){height:11px}.lvl i:nth-child(5){height:13px}
.lvl i.on{background:var(--t,var(--ink))}
.notice{border:1px solid var(--line-2);background:var(--surface);padding:11px 15px;border-radius:8px;font-size:.92rem;color:var(--muted)}
.notice.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--ink);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.notice.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ink);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--ink);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.list{display:flex;flex-direction:column}
.list > *{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.list > *:last-child{border-bottom:0}
.link{background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer;font-weight:500;min-width:0}
.link:hover{color:var(--focus)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:transparent;border:1px solid var(--line-2);color:var(--muted);padding:6px 13px;border-radius:999px;cursor:pointer;font-size:.86rem;display:inline-flex;gap:7px;align-items:center}
.pill:hover{color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--primary-ink);border-color:var(--ink)}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:84px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:500}
label.f small{font-weight:400;color:var(--muted)}
label.chk{display:flex;gap:9px;align-items:flex-start;font-size:.94rem;cursor:pointer}
label.chk input{margin-top:5px;accent-color:var(--ink)}

/* código */
.codebox{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.codebox pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:.86rem;line-height:1.6;color:#d7deee}
.codebox .cp{position:absolute;top:8px;right:8px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);border-radius:6px;font-size:.74rem;padding:2px 8px;cursor:pointer}
.codebox .cp:hover{color:var(--ink)}
.out{font-family:var(--f-mono);font-size:.84rem;background:var(--code-bg);color:#cfe3ff;border:1px solid var(--line);border-radius:6px;padding:7px 11px;display:inline-block;align-self:flex-start;white-space:pre-wrap}
.out::before{content:"› ";color:var(--dim)}

/* ===== início ===== */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:36px;align-items:center;padding-top:8px}
@media (max-width:1120px){.hero{grid-template-columns:1fr;gap:26px}}
.hero h1{font-size:3.4rem;font-weight:800;line-height:1;letter-spacing:-.03em}
@media (max-width:980px){.hero h1{font-size:2.5rem}}
.hero .lead{color:var(--muted);font-size:1.08rem;max-width:46ch;margin-top:16px}
.hero .row{margin-top:24px}
.editor{background:var(--code-bg);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.ed-top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.ed-top i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.ed-top span{margin-left:8px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.ed-code{padding:14px 0;font-family:var(--f-mono);font-size:.86rem;line-height:1.75;overflow-x:auto}
.ed-code div{display:grid;grid-template-columns:42px 1fr;white-space:pre;padding-right:16px}
.ed-code div b{font-weight:400;color:var(--dim);text-align:right;padding-right:16px;user-select:none}
.ed-code .k{color:var(--ia)} .ed-code .s{color:var(--iot)} .ed-code .f{color:var(--prog)}
.ed-code .bug{text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.ed-code div.hl{background:color-mix(in srgb,var(--bad) 10%,transparent)}
@media (max-width:560px){.ed-code{font-size:.7rem}.ed-code div{grid-template-columns:28px 1fr;padding-right:10px}.ed-code div b{padding-right:8px}}
.ed-out{border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg-2)}
.ed-out code{background:none;border:0;padding:0;color:var(--bad);font-size:.92rem}
.tracks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1120px){.tracks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tracks{grid-template-columns:1fr}}
.track{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-width:0}
.track::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--t)}
.track:hover{border-color:var(--line-2);background:var(--surface-2)}
.track .ico{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 16%,transparent);color:var(--t)}
.track .ico svg{width:21px;height:21px}
.track h3{font-size:1.15rem}
.track p{font-size:.88rem;color:var(--muted)}
.meter{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;background:var(--t,var(--ink))}
.stats{display:flex;gap:34px;flex-wrap:wrap;padding:4px 2px}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.86rem;color:var(--muted)}

/* ===== laboratório: lista de issues ===== */
.issues{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.issue{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
.issue:last-child{border-bottom:0}
.issue:hover{background:var(--surface-2)}
.issue .state{width:18px;height:18px;border-radius:50%;border:2px solid var(--t);margin-top:3px;display:grid;place-items:center}
.issue .state.done{background:var(--t)}
.issue .state.done::after{content:"";width:6px;height:6px;background:var(--surface);border-radius:50%}
.issue h3{font-size:1.08rem;font-family:var(--f-body);font-weight:600;letter-spacing:0}
.issue .sys{font-size:.86rem;color:var(--muted);margin-top:2px}
.issue .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.82rem;color:var(--dim)}
.issue .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:640px){.issue{grid-template-columns:22px minmax(0,1fr)}.issue .right{grid-column:2;align-items:flex-start;flex-direction:row}}

/* ===== bancada (lab) ===== */
.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative}
.stepper::before{content:"";position:absolute;left:calc(100%/14);right:calc(100%/14);top:15px;height:2px;background:var(--line-2)}
.stepper .prog{position:absolute;left:calc(100%/14);top:15px;height:2px;background:var(--t,var(--ink))}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--dim);min-width:0}
.step[disabled]{cursor:default}
.step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);font-size:.82rem;font-weight:600}
.step.done .num{border-color:var(--t,var(--ink));color:var(--t,var(--ink))}
.step.cur .num{background:var(--t,var(--ink));border-color:var(--t,var(--ink));color:var(--primary-ink)}
.step .lb{font-size:.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step.cur .lb{color:var(--ink)}
@media (max-width:700px){.step .lb{display:none}.step.cur .lb{display:block;position:absolute;top:38px;white-space:nowrap;overflow:visible}.stepper{padding-bottom:22px}}

details.fold[open] summary::after{content:"−"}
details.fold[open] summary{margin-bottom:14px}
.stage-head{display:flex;gap:16px;align-items:flex-start;margin-bottom:16px}
.stage-head .n{font-family:var(--f-display);font-size:2.8rem;font-weight:800;line-height:.85;color:var(--t,var(--ink));font-variant-numeric:tabular-nums}
.stage-head p{color:var(--muted);margin-top:6px;max-width:62ch}
.opt{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line-2);border-radius:8px;background:transparent;cursor:pointer;text-align:left;width:100%;color:inherit}
.opt:hover{background:var(--surface-2)}
.opt.sel{border-color:var(--t,var(--ink));background:color-mix(in srgb,var(--t,var(--ink)) 9%,transparent)}

.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.test{border:1px solid var(--line-2);border-radius:8px;padding:13px 15px;display:flex;flex-direction:column;gap:9px}

.test.unsafe{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 8%,transparent)}
.test .tt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.marks{display:flex;gap:4px;flex-wrap:wrap}

.marks button[aria-pressed="true"].sup{border-color:var(--ok);color:var(--ok)}
.marks button[aria-pressed="true"].wk{border-color:var(--bad);color:var(--bad)}
.marks button[aria-pressed="true"].inc{border-color:var(--ink);color:var(--ink)}
.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
@media (max-width:820px){.tools{grid-template-columns:1fr}}
.hintbox{border:1px dashed color-mix(in srgb,var(--warn) 60%,transparent);border-radius:8px;padding:10px 12px;font-size:.92rem}
.assist{display:flex;flex-direction:column;gap:10px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
.msg{padding:9px 12px;border-radius:8px;font-size:.92rem;white-space:pre-wrap}
.msg.u{background:var(--surface-2);align-self:flex-end;max-width:90%}
.msg.a{background:var(--bg);border:1px solid var(--line)}
.score{display:flex;gap:30px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:2.7rem;font-weight:800;font-variant-numeric:tabular-nums}
.ring .v small{display:block;font-size:.85rem;color:var(--muted);text-align:center;margin-top:-6px;font-weight:500;font-family:var(--f-body)}
.bars{display:flex;flex-direction:column;gap:10px;flex:1;min-width:220px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:.88rem}
.bar .tr{height:7px;background:var(--surface-2);border-radius:4px;overflow:hidden}

/* ===== trilhas e lições ===== */

.tl-dot{width:38px;height:38px;border-radius:50%;background:var(--surface);border:2px solid var(--line-2);display:grid;place-items:center;font-size:.86rem;font-weight:600;position:relative;z-index:1;color:var(--muted)}

.tl-item.next .tl-dot{border-color:var(--t);color:var(--t)}

.thead{display:flex;gap:16px;align-items:center}

/* ===== projetos ===== */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.project{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:10px;cursor:pointer;text-align:left;color:inherit;min-width:0;border-left:3px solid var(--t)}

.toolset{display:flex;gap:6px;flex-wrap:wrap}
.steps{display:flex;flex-direction:column;gap:2px;counter-reset:s}
.steps label{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:flex-start;padding:10px 8px;border-radius:8px;cursor:pointer}
.steps label:hover{background:var(--surface-2)}
.steps input{position:absolute;opacity:0;pointer-events:none}
.steps .box{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-size:.8rem;color:var(--muted);counter-increment:s}
.steps .box::before{content:counter(s)}
.steps input:checked + .box{background:var(--t);border-color:var(--t);color:var(--primary-ink)}
.steps input:checked + .box::before{content:"✓"}
.steps input:checked ~ span{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.steps input:focus-visible + .box{outline:2px solid var(--focus);outline-offset:2px}

/* ===== notícias e livros ===== */
.news-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
@media (max-width:420px){.news-grid{grid-template-columns:1fr}}
.news{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.np{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;padding:14px 16px;background:var(--bg-2);color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.np[href]:hover{background:var(--surface-2)}
.np-ico{width:42px;height:42px;border-radius:10px;background:color-mix(in srgb,var(--t,var(--ink)) 16%,transparent);color:var(--t,var(--ink));display:grid;place-items:center}
.np-ico svg{width:22px;height:22px}
.np-meta{display:flex;flex-direction:column;min-width:0}
.np-meta b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-meta span{font-size:.8rem;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.np-date{font-size:.8rem;color:var(--muted);white-space:nowrap}
.news-body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}

.news-actions{margin-top:auto;gap:8px}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}
@media (max-width:520px){.books{grid-template-columns:1fr}}
.book{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-columns:124px minmax(0,1fr);gap:18px;padding:18px;min-width:0}
@media (max-width:520px){.book{grid-template-columns:92px minmax(0,1fr);gap:12px;padding:14px}}
.cover{aspect-ratio:2/3;max-width:100%;border-radius:4px 8px 8px 4px;padding:12px 10px 10px 14px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;align-self:start;background:var(--t,var(--ia));color:var(--primary-ink);box-shadow:inset 5px 0 0 rgba(0,0,0,.18),0 10px 24px -12px rgba(0,0,0,.8)}
.cover::after{content:"";position:absolute;right:-30%;bottom:-20%;width:90%;aspect-ratio:1;border-radius:50%;border:10px solid rgba(255,255,255,.18)}
.cv-title{font-family:var(--f-display);font-weight:800;font-size:1.02rem;line-height:1.05;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto;position:relative;z-index:1}
.cv-auth{font-size:.66rem;margin-top:auto;opacity:.8;position:relative;z-index:1}
@media (max-width:520px){.cv-title{font-size:.84rem}}
.book-body{display:flex;flex-direction:column;gap:8px;min-width:0}
.book-body h3{font-size:1.25rem}
.why{border-left:3px solid var(--t,var(--ink));padding-left:11px}

/* ===== admin ===== */
.tbl-wrap{overflow-x:auto}

.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.fgrid .wide,.fgrid .sec{grid-column:1/-1}
.fgrid .sec{padding-top:16px;margin-top:6px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.fgrid .sec:first-child{border-top:0;margin-top:0;padding-top:0}
@media (max-width:700px){.fgrid{grid-template-columns:1fr}}
.rep{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.rep-row{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rep-row .wide{grid-column:1/-1}
@media (max-width:700px){.rep-row{grid-template-columns:1fr}}
.rep-row .rhead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.sticky-actions{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 -10px 30px rgba(0,0,0,.35)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:34px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.badge{display:flex;gap:11px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:var(--r)}
.badge .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--dim);flex-shrink:0;font-weight:700;font-size:.82rem}
.badge.on .ico{background:var(--ink);color:var(--primary-ink)}
.badge:not(.on){opacity:.5}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--primary-ink);padding:10px 16px;border-radius:8px;font-size:.92rem;z-index:30;max-width:calc(100% - 32px);font-weight:500}

.fav{background:none;border:1px solid var(--line-2);border-radius:8px;padding:6px 11px;cursor:pointer;color:var(--muted);font-size:.86rem;min-height:34px}

@media (max-width:640px){.phase{grid-template-columns:1fr}}
/* ===== destaque ===== */
.bill{position:relative;min-height:min(82vh,700px);display:flex;align-items:flex-end;overflow:hidden;isolation:isolate;padding-top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 40px);padding-bottom:max(120px,15vh);padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.bill-art{position:absolute;inset:0;z-index:-3;background:radial-gradient(70% 90% at 78% 28%,color-mix(in srgb,var(--t) 42%,transparent),transparent 66%),radial-gradient(45% 55% at 96% 92%,color-mix(in srgb,var(--red) 32%,transparent),transparent 72%),#0b0b0c}
.bill-log{position:absolute;right:max(var(--gut),2vw);top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 34px);width:min(50vw,700px);display:flex;flex-direction:column;gap:12px;z-index:-2;font-family:var(--f-mono);font-size:clamp(.85rem,1.45vw,1.25rem);color:#fff;transform:perspective(1000px) rotateY(-16deg);transform-origin:right center}
.bill-log span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:7px 14px;border-left:3px solid var(--t);background:rgba(0,0,0,.4);opacity:.55}
.bill-log span::before{content:"› ";color:var(--t)}
.bill-log span:nth-child(2n){opacity:.4} .bill-log span:nth-child(3n){opacity:.28}
.bill::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(15,15,16,.97) 0%,rgba(15,15,16,.78) 30%,rgba(15,15,16,0) 62%),linear-gradient(0deg,var(--bg) 3%,rgba(15,15,16,0) 34%)}
.bill-body{max-width:min(640px,100%);display:flex;flex-direction:column;gap:16px}
.bill-kind{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem;color:#e5e5e5}
.bill-title{font-family:var(--f-display);font-weight:900;font-stretch:76%;font-size:clamp(2.6rem,5.4vw,4.7rem);line-height:.95;letter-spacing:-.01em;text-shadow:0 4px 30px rgba(0,0,0,.5)}
.bill-meta{display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.95rem;color:#e5e5e5}
.box{border:1px solid rgba(255,255,255,.4);padding:0 7px;border-radius:3px;font-size:.78rem;line-height:1.6;color:#e5e5e5}
.bill-desc{font-size:1.08rem;line-height:1.5;color:#f2f2f2;max-width:52ch;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.btn.play{background:#fff;color:#000;border-color:#fff;font-weight:700;padding:8px 24px 8px 18px;font-size:1.02rem;min-height:44px;border-radius:5px}

.btn.info{background:rgba(109,109,110,.72);border-color:transparent;color:#fff;font-weight:600;padding:8px 22px 8px 18px;font-size:1.02rem;min-height:44px;border-radius:5px}
.btn.info:hover{background:rgba(109,109,110,.45)}
.btn svg{width:22px;height:22px;flex-shrink:0}
@media (max-width:760px){
  .bill{min-height:0;flex-direction:column;align-items:stretch;justify-content:flex-end;gap:22px;padding-top:calc(var(--hdr) + env(safe-area-inset-top,0px) + 12px);padding-bottom:34px}
  .bill-log{position:relative;top:auto;right:auto;width:auto;transform:none;font-size:.76rem;gap:7px}
  .bill-log span:nth-child(n+4){display:none}
  .bill::after{background:linear-gradient(0deg,var(--bg) 8%,rgba(15,15,16,.55) 55%,rgba(15,15,16,.25))}
  .bill-desc{font-size:.98rem}
  .bill-body .row{flex-wrap:nowrap;gap:8px}
  .bill-body .btn.play,.bill-body .btn.info{flex:1;padding-inline:10px;font-size:.95rem}
  main.full .bill + .rows{margin-top:6px}
}

/* ===== fileiras ===== */
.rows{display:flex;flex-direction:column;gap:34px;margin-top:max(-100px,-9vh);position:relative;z-index:2}
.rows.nob,.rows.plain{margin-top:26px}
.rows.nob{padding-top:calc(var(--hdr) + env(safe-area-inset-top,0px))}
.rowsec{position:relative;min-width:0}
.row-h{display:flex;align-items:baseline;gap:14px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px))}
.row-h h2{font-family:var(--f-body);font-size:1.28rem;font-weight:700;letter-spacing:0}
.row-h .more{background:none;border:0;color:var(--prog);font-size:.88rem;font-weight:600;cursor:pointer;padding:0;opacity:0;transition:opacity .2s}
.rowsec:hover .row-h .more,.row-h .more:focus-visible{opacity:1}
@media (hover:none){.row-h .more{opacity:1}}
.rail-wrap{position:relative}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 5 * 8px) / 6);gap:8px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;scrollbar-width:none;padding-block:16px 18px;padding-left:max(var(--gut),env(safe-area-inset-left,0px));padding-right:max(var(--gut),env(safe-area-inset-right,0px));scroll-padding-inline:max(var(--gut),env(safe-area-inset-left,0px))}
.rail::-webkit-scrollbar{display:none}
.rail > *{scroll-snap-align:start}
.rail.tall{grid-auto-columns:calc((100% - 6 * 8px) / 7)}
@media (max-width:1400px){.rail{grid-auto-columns:calc((100% - 4 * 8px) / 5)}.rail.tall{grid-auto-columns:calc((100% - 5 * 8px) / 6)}}
@media (max-width:1100px){.rail{grid-auto-columns:calc((100% - 3 * 8px) / 4)}.rail.tall{grid-auto-columns:calc((100% - 4 * 8px) / 5)}}
@media (max-width:800px){.rail{grid-auto-columns:calc((100% - 2 * 8px) / 3)}.rail.tall{grid-auto-columns:calc((100% - 3 * 8px) / 4)}}
@media (max-width:560px){.rail{grid-auto-columns:calc((100% - 8px) / 1.55)}.rail.tall{grid-auto-columns:calc((100% - 2 * 8px) / 2.5)}}
.rail-btn{position:absolute;top:16px;bottom:18px;width:max(var(--gut),36px);z-index:4;border:0;background:rgba(15,15,16,.62);color:#fff;font-size:2.6rem;line-height:1;cursor:pointer;opacity:0;transition:opacity .2s;display:grid;place-items:center}

.rail-btn:hover{background:rgba(15,15,16,.85)}
@media (hover:none){.rail-btn{display:none}}

/* ===== capas ===== */
.tile{background:none;border:0;padding:0;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-width:0;width:100%;position:relative}
.tile .art,.ep-art .art,.m-hero .art,.m-more .art{width:100%}

@media (hover:hover){.tile:hover .art{transform:scale(1.07);box-shadow:0 14px 34px rgba(0,0,0,.7);z-index:2}}

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
const clone = o => JSON.parse(JSON.stringify(o));
const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
const clean = a => arr(a).map(s => String(s).trim()).filter(Boolean);
const uid8 = () => Math.random().toString(36).slice(2, 10);
const slug = s => String(s || "item").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "item";
const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso); return isNaN(d) ? "" : d.toLocaleDateString("pt-BR", { day: "numeric", month: "short", year: "numeric" }); };
const getPath = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
const setPath = (o, p, v) => { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; }); a[ks[ks.length - 1]] = v; };
/* armazenamento: no programa instalado (Electron) os dados vão para um arquivo com cópias diárias; no navegador, localStorage */
const DESK = window.volterDesktop || null;
let DSTORE = null, dTimer = null;
const dFlush = () => { clearTimeout(dTimer); dTimer = null; if (DESK && DSTORE) DESK.saveSync(JSON.stringify(DSTORE)); };
const lsGet = (k, d) => { if (DSTORE) return k in DSTORE ? clone(DSTORE[k]) : d; try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { if (DSTORE) { DSTORE[k] = clone(v); clearTimeout(dTimer); dTimer = setTimeout(dFlush, 400); return; } try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { if (DSTORE) { delete DSTORE[k]; dFlush(); return; } try { localStorage.removeItem(k); } catch (e) {} };
window.addEventListener("beforeunload", () => { if (dTimer) dFlush(); });
function codeBox(code) { return '<div class="codebox"><button class="cp" type="button" data-act="copy">Copiar</button><pre><code>' + esc(code) + "</code></pre></div>"; }
function md(t) {
  const blocks = []; const src = String(t || "").replace(/```[a-z]*\n([\s\S]*?)```/g, (m, code) => { blocks.push(code.replace(/\n$/, "")); return "\n\n@@CODE" + (blocks.length - 1) + "@@\n\n"; });
  return src.split(/\n\s*\n/).map(b => {
    const tb = b.trim(); const cm = tb.match(/^@@CODE(\d+)@@$/); if (cm) return codeBox(blocks[+cm[1]]);
    if (!tb) return "";
    const lines = b.split("\n");
    if (lines[0].startsWith("## ")) { const rest = lines.slice(1).join("\n"); return "<h3>" + inl(lines[0].slice(3)) + "</h3>" + (rest.trim() ? md(rest) : ""); }
    const out = []; let para = [], list = [];
    const flushP = () => { if (para.length) { out.push("<p>" + inl(para.join(" ")) + "</p>"); para = []; } };
    const flushL = () => { if (list.length) { out.push("<ul>" + list.map(x => "<li>" + inl(x) + "</li>").join("") + "</ul>"); list = []; } };
    lines.forEach(l => { const s = l.trim(); if (s.startsWith("- ")) { flushP(); list.push(s.slice(2)); } else if (s) { flushL(); para.push(s); } });
    flushP(); flushL(); return out.join("");
  }).join("");
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

/* ---------- vocabulário ---------- */
/* Trilhas da grade de temas (docs/grade-de-temas.md). "plan" lista os cursos planejados que ainda não têm lições:
   aparecem para o aluno como "Em breve". A trilha de IoT saiu da grade: os itens com track "iot" ficam guardados, mas ocultos. */
const TRACKS = [
  { id: "ia", name: "IA no Trabalho", short: "IA no trabalho", ico: "ia", desc: "ChatGPT, Claude e Gemini no dia a dia: prompts, documentos, planilhas e pesquisa com fontes conferidas.",
    plan: [["E-mails, atas e relatórios com IA", "Kit de modelos de documentos"], ["Planilhas e Excel com IA", "Planilha automatizada do próprio trabalho"], ["Apresentações e imagens com IA", "Apresentação completa gerada e revisada"], ["Pesquisa e estudo com IA: checar fontes e evitar erros", "Dossiê de pesquisa com fontes verificadas"]] },
  { id: "agentes", name: "Agentes e Automação", short: "Agentes", ico: "agente", desc: "n8n, WhatsApp, APIs de IA e agentes que executam tarefas sozinhos.",
    plan: [["Automação sem código com n8n", "Fluxo que economiza 1 hora por semana"], ["WhatsApp + IA: atendimento automático", "Atendente virtual para pequeno negócio"], ["APIs de IA para não programadores", "Integração entre IA e Google Planilhas"], ["Agentes para pequenas empresas", "Agente de vendas ou de agenda"]] },
  { id: "prog", name: "Programação com IA", short: "Programação", ico: "codigo", desc: "Lógica, Python e web aprendendo com a IA como tutora, até um app instalável.",
    plan: [["Sites e apps web com IA", "Site pessoal publicado"], ["Do projeto ao app instalável", "App desktop com instalador Windows e Mac"]] },
  { id: "dados", name: "Dados e Decisão", short: "Dados", ico: "dados", desc: "Planilhas, SQL e dashboards para decidir com números.",
    plan: [["Dados para quem não é de dados", "Painel com dados do próprio trabalho"], ["Dashboards com Power BI ou Looker Studio", "Dashboard publicado"]] },
  { id: "profissao", name: "IA por Profissão", short: "Profissões", ico: "pessoas", desc: "IA aplicada a pequenos negócios, RH, educação, saúde e profissões técnicas.",
    plan: [["IA para pequenos negócios e autônomos", "Plano de marketing e atendimento com IA"], ["IA para RH e recrutamento", "Processo seletivo assistido por IA"], ["IA para professores", "Plano de aula e materiais gerados"], ["IA para profissionais de saúde (administrativo)", "Rotina de documentos e agenda com IA"], ["IA para técnicos e profissões práticas", "Relatórios técnicos e orçamentos com IA"]] },
  { id: "seguranca", name: "Segurança e Uso Responsável", short: "Segurança", ico: "escudo", desc: "Golpes, deepfakes, LGPD e regras para usar IA com os dados da empresa.",
    plan: [["Golpes, deepfakes e phishing na era da IA", "Checklist de proteção pessoal e da família"], ["LGPD e dados da empresa ao usar IA", "Política de uso de IA para a equipe"]] },
  { id: "carreira", name: "Carreira em Tecnologia", short: "Carreira", ico: "carreira", desc: "Bônus: recomeço em tecnologia depois dos 40, com plano de transição e portfólio.",
    plan: [["Recomeço em tecnologia depois dos 40", "Plano de transição de carreira com portfólio"]] }
];
const TRACK_IDS = new Set(TRACKS.map(t => t.id));
/* Notícias suspensas: a seção some do app e nada novo é publicado. Para reativar, troque para true. */
const NEWS_ON = false;
const trackOf = id => TRACKS.find(t => t.id === id) || TRACKS[0];
const LEVELS = [[1, "1 · Primeiros passos"], [2, "2 · Básico"], [3, "3 · Intermediário"], [4, "4 · Avançado"], [5, "5 · Profissional"]];
const LEVEL_NAME = { 1: "Primeiros passos", 2: "Básico", 3: "Intermediário", 4: "Avançado", 5: "Profissional" };
const NEWS_CATS = ["IA e agentes", "Programação e web", "Dados e análise", "IoT e robótica", "Carreira e mercado", "Ferramentas e lançamentos"];
const NEWS_T = { "IA e agentes": "ia", "Programação e web": "prog", "Dados e análise": "dados", "IoT e robótica": "iot" };
const BOOK_AREAS = ["IA e agentes", "Programação", "Dados e análise", "IoT e robótica", "Carreira"];
const BOOK_T = { "IA e agentes": "ia", "Programação": "prog", "Dados e análise": "dados", "IoT e robótica": "iot" };
const TESTVAL = [["util", "Útil: aproxima da causa"], ["neutro", "Neutro: válido, elimina pouco"], ["irrelevante", "Irrelevante: perda de tempo"], ["inseguro", "Inseguro: penaliza e não executa"]];
const STATUS = { draft: "Rascunho", review: "Em revisão", published: "Publicado", archived: "Arquivado" };
const STAGES = ["Entender", "Hipóteses", "Investigar", "Evidências", "Causa", "Corrigir", "Aprender"];
const STAGE_TXT = ["Leia o cenário com calma. O que o sistema deveria fazer, o que está fazendo e o que mudou?", "Marque as causas que você considera possíveis. De duas a quatro é uma boa faixa.", "Cada verificação custa tempo. Escolha as que mais separam as suas hipóteses. O resultado aparece quando você executa.", "Revise o que encontrou e marque, para cada hipótese, se as evidências a sustentam ou a enfraquecem.", "Qual é a causa mais provável? Ao confirmar, as etapas anteriores ficam travadas.", "Escolha a correção. Prefira a que resolve a causa e evita que o problema volte."];
const TYPES = { cases: { label: "Laboratório", one: "desafio", m: 1 }, lessons: { label: "Lições", one: "lição" }, projects: { label: "Projetos", one: "projeto", m: 1 }, news: { label: "Notícias", one: "notícia" }, books: { label: "Livros", one: "livro", m: 1 } };
const COLLS = ["cases", "lessons", "projects", "news", "books"];
const ROUTE_OF = { cases: "caso", lessons: "licao", projects: "projeto", news: "noticias", books: "livros" };
const lvl = n => '<span class="lvl" title="Nível ' + n + '">' + [1, 2, 3, 4, 5].map(i => '<i class="' + (i <= n ? "on" : "") + '"></i>').join("") + "</span>";
const tchip = id => { const t = trackOf(id); return '<span class="tchip" data-t="' + t.id + '"><span class="dot"></span>' + esc(t.short) + "</span>"; };

/* ---------- estado ---------- */
const S = {
  mode: "loading", db: null, user: null, assets: null, sample: null, uid: null, admin: false,
  dbState: "loading", content: { cases: [], lessons: [], projects: [], news: [], books: [] },
  prog: null, progWhere: "local", route: { name: "inicio", id: null },
  editor: null, quiz: null, assist: {}, ui: { modal: null, track: "", level: 0, q: "", ncat: "", barea: "", ptrack: "", stab: "cases", sfilter: "", open: {}, more: false }, pending: false
};
function defProg() { return { v: 1, attempts: {}, runs: {}, favorites: [], lessons: {}, projects: {}, quick: [], recent: [], settings: { hintPenalty: true }, updatedAt: "" }; }
S.prog = Object.assign(defProg(), lsGet("volter.prog", {}));
let pushQ = Promise.resolve(), pushT = null;
function saveProg() {
  S.prog.updatedAt = new Date().toISOString();
  lsSet("volter.prog", S.prog);
  clearTimeout(pushT); pushT = setTimeout(() => { pushQ = pushQ.then(pushProg); }, 700);
}
async function pushProg() {
  if (!S.db || !S.uid || S.progWhere === "local-only") return;
  try { await S.db.doc("data/users/" + S.uid + "/main").set(clone(S.prog)); S.progWhere = "conta"; }
  catch (e) { S.progWhere = "local-only"; }
}

/* ---------- conteúdo ---------- */
const all = t => S.content[t];
const shown = (t, x) => (t !== "news" || NEWS_ON) && (!x.track || TRACK_IDS.has(x.track));
const pub = t => S.content[t].filter(x => x.status === "published" && shown(t, x));
const find = (t, id) => S.content[t].find(x => x.id === id);
const visible = (t, id) => { const x = find(t, id); return x && ((x.status === "published" && shown(t, x)) || S.admin) ? x : null; };
const isFav = k => S.prog.favorites.includes(k);
function favBtn(k) { const on = isFav(k); return '<button class="fav" data-act="fav" data-k="' + esc(k) + '" aria-pressed="' + on + '">' + (on ? "★ Salvo" : "☆ Salvar") + "</button>"; }
function localLoad() {
  const seed = window.VOLTER_SEED || {}; const ov = lsGet("volter.content", {});
  COLLS.forEach(t => {
    const base = Object.assign({}, seed[t] || {}, ov[t] || {});
    S.content[t] = Object.entries(base).filter(([, d]) => d).map(([id, d]) => Object.assign({ id }, d));
  });
}
function localWrite(t, id, doc) { const ov = lsGet("volter.content", {}); ov[t] = ov[t] || {}; ov[t][id] = doc; lsSet("volter.content", ov); }
function exportContent() {
  const out = {}; COLLS.forEach(t => { out[t] = {}; S.content[t].forEach(x => { const d = clone(x); delete d.id; out[t][x.id] = d; }); });
  const js = "// Conteúdo do Volter, gerado pelo editor em " + new Date().toLocaleString("pt-BR") + "\nwindow.VOLTER_SEED = " + JSON.stringify(out, null, 1) + ";\n";
  if (DESK && DESK.saveFile) { DESK.saveFile("conteudo.js", js).then(r => toast(r && r.saved ? "conteudo.js salvo" : "Exportação cancelada")); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([js], { type: "text/javascript" })); a.download = "conteudo.js"; document.body.appendChild(a); a.click(); a.remove();
  toast("Arquivo conteudo.js gerado");
}
const tracksLessons = id => pub("lessons").filter(l => l.track === id).sort((a, b) => (a.order || 0) - (b.order || 0));
const lessonDone = id => !!(S.prog.lessons[id] && S.prog.lessons[id].done);
const trackPct = id => { const ls = tracksLessons(id); return ls.length ? Math.round(ls.filter(l => lessonDone(l.id)).length / ls.length * 100) : 0; };

/* ---------- navegação ---------- */
const NAVDEF = [
  ["", [["inicio", "Início"]]],
  ["Aprender", [["trilhas", "Trilhas"], ["lab", "Laboratório"], ["projetos", "Projetos"], ["desafios", "Treino"]]],
  ["Ficar em dia", [["noticias", "Notícias"], ["livros", "Livros"]].filter(([r]) => r !== "noticias" || NEWS_ON)],
  ["Você", [["progresso", "Meu progresso"], ["favoritos", "Salvos"]]]
];
const TABS = [["inicio", "Início"], ["trilhas", "Trilhas"], ["lab", "Lab"], ["progresso", "Progresso"]];
function go(name, id) { if (name === "noticias" && !NEWS_ON) name = "inicio"; S.route = { name, id: id || null }; S.ui.more = false; S.ui.modal = null; window.scrollTo(0, 0); render(true); renderModal(); }
const FULL = ["inicio", "trilhas"];
function navGroup() { return { caso: "lab", correcao: "lab", licao: "trilhas", trilha: "trilhas", projeto: "projetos", editor: "admin" }[S.route.name] || S.route.name; }

/* ---------- render ---------- */
function render(force) {

async function askAssist(caseId, q) {

    "DESAFIO: " + c.title + "\nSistema: " + c.equipment + "\nCenário: " + c.context + "\nSintomas: " + arr(c.symptoms).join(" | ") + "\nO que mudou: " + c.history + "\nQuando acontece: " + c.conditions + "\nDetalhes técnicos: " + arr(c.techInfo).join(" | ") +
    "\nHipóteses do aluno:\n" + hyp + "\nVerificações feitas e resultados:\n" + tests + "\nEtapa atual: " + (run ? STAGES[run.stage - 1] : "-");
  const msgs = a.msgs.map((m, i) => ({ role: m.role, content: i === 0 ? sys + "\n\nPERGUNTA DO ALUNO: " + m.content : m.content }));
  try {
    const res = await S.sample(msgs, { cache: false, onText: ({ text }) => { const box = $("#msgs"); if (box) { let el = $("#live", box); if (!el) { el = document.createElement("div"); el.id = "live"; el.className = "msg a"; box.appendChild(el); } el.textContent = text; box.scrollTop = box.scrollHeight; } } });

function scoreRun(c, run) {

  const tests = arr(c.tests), used = tests.filter(t => run.tests.includes(t.id));

/* ----- Progresso ----- */
function calcXP() { let x = 0; for (const id in S.prog.attempts) { const a = S.prog.attempts[id]; if (a.length) x += Math.max(...a.map(t => t.score)); } for (const id in S.prog.lessons) if (S.prog.lessons[id].done) x += 20; for (const id in (S.prog.projects || {})) if (S.prog.projects[id].done) x += 50; return x; }
const LV = [[0, "Explorador"], [150, "Aprendiz"], [400, "Construtor"], [800, "Desenvolvedor"], [1400, "Especialista"]];
function levelFor(x) { let r = LV[0]; LV.forEach(l => { if (x >= l[0]) r = l; }); const i = LV.indexOf(r); return { name: r[1], min: r[0], next: LV[i + 1] }; }
VIEWS.progresso = () => {
  const xp = calcXP(), lv = levelFor(xp);
  const atts = Object.entries(S.prog.attempts).filter(([id]) => find("cases", id)).flatMap(([id, a]) => a.map(t => Object.assign({ id }, t)));
  const comp = k => { const v = atts.map(a => a.parts[k] / ({ hyp: 20, inv: 30, diag: 30, sol: 20, seg: 100 })[k]); return v.length ? Math.round(v.reduce((s, x) => s + x, 0) / v.length * 100) : 0; };
  const last = {}; atts.forEach(a => last[a.id] = a);
  const anyTrack = TRACKS.some(t => { const ls = tracksLessons(t.id); return ls.length && ls.every(l => lessonDone(l.id)); });
  const projDone = Object.values(S.prog.projects || {}).some(p => p.done);
  const badges = [["1º", "Primeiro problema resolvido", "Concluiu um desafio do Laboratório", atts.length > 0], ["IN", "Investigação certeira", "90% ou mais na investigação", atts.some(a => a.parts.inv >= 27)], ["SG", "Sem atalhos", "3 desafios sem ação insegura", Object.values(last).filter(a => !a.unsafe).length >= 3], ["SD", "Sem dicas", "Acertou a causa sem pedir dica", atts.some(a => !a.hints && a.parts.diag)], ["✓", "Trilha concluída", "Todas as lições de uma trilha", !!anyTrack], ["PJ", "Projeto entregue", "Concluiu um projeto guiado", projDone], ["5/5", "Treino perfeito", "5 de 5 no treino rápido", S.prog.quick.some(q => q.score === q.total && q.total >= 5)]];
  const where = S.mode === "local" ? (DESK ? "Seu progresso fica salvo neste computador, com uma cópia automática por dia." : "Seu progresso fica salvo neste navegador.") : S.progWhere === "conta" ? "Seu progresso está salvo na sua conta e acompanha você em outros dispositivos." : S.uid && S.progWhere !== "local-only" ? "Sincronizando com a sua conta…" : "Seu progresso está salvo apenas neste navegador.";
  return head("Meu progresso", where) +
    '<section class="stats"><div class="stat"><b>' + lv.name + "</b><span>" + (lv.next ? "faltam " + (lv.next[0] - xp) + " XP para " + lv.next[1] : "nível máximo") + '</span></div><div class="stat"><b>' + xp + '</b><span>XP</span></div><div class="stat"><b>' + atts.length + '</b><span>investigações</span></div><div class="stat"><b>' + Object.values(S.prog.lessons).filter(l => l.done).length + "</b><span>lições</span></div></section>" +
    '<div class="split"><div class="stack" style="gap:18px"><div class="panel"><h3>Trilhas</h3><div class="bars">' + TRACKS.map(t => { const v = trackPct(t.id); return '<div class="bar" data-t="' + t.id + '"><span>' + esc(t.short) + '</span><span class="tr"><i style="width:' + v + '%"></i></span><span class="v">' + v + "%</span></div>"; }).join("") + "</div></div>" +
    '<div class="panel"><h3>Como você investiga</h3>' + (atts.length ? '<div class="bars">' + [["Raciocínio", "hyp"], ["Investigação", "inv"], ["Diagnóstico", "diag"], ["Correção", "sol"], ["Segurança", "seg"]].map(([l, k]) => { const v = comp(k); return '<div class="bar"><span>' + l + '</span><span class="tr"><i style="width:' + v + '%"></i></span><span class="v">' + v + "%</span></div>"; }).join("") + "</div>" : '<p class="muted small">Resolva um desafio no Laboratório para ver como você investiga.</p>') + "</div>" +
    '<div class="panel"><h3>Conquistas</h3><div class="badges">' + badges.map(([ic, t, d, on]) => '<div class="badge' + (on ? " on" : "") + '"><span class="ico">' + ic + '</span><div><b class="small">' + t + '</b><div class="small muted">' + d + "</div></div></div>").join("") + "</div></div></div>" +
    '<div class="stack" style="gap:18px"><div class="panel"><h3>Histórico</h3><div class="list">' + (atts.sort((a, b) => b.at.localeCompare(a.at)).slice(0, 10).map(a => { const c = find("cases", a.id); return '<div><div style="min-width:0"><button class="link" data-act="go" data-r="correcao" data-id="' + esc(a.id) + '">' + esc(c ? c.title : a.id) + '</button><div class="small dim">' + fmtDate(a.at) + '</div></div><span style="font-variant-numeric:tabular-nums">' + a.score + "</span></div>"; }).join("") || '<div class="muted small">Nenhuma investigação ainda.</div>') + "</div></div>" +

  if (el.dataset.path && S.editor) {
    const k = el.dataset.kind; let v = el.value;
    if (k === "bool") v = el.checked; else if (k === "num") v = el.value === "" ? "" : Number(el.value); else if (k === "lines") v = el.value.split("\n");
    setPath(S.editor.draft, el.dataset.path, v);
    if (el.tagName === "SELECT" && el.dataset.path.endsWith(".type")) render(true);
  }
  if (el.dataset.actFile === "img" && el.files && el.files[0]) uploadImg(el);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.path && S.editor && el.dataset.kind !== "bool") {
    const k = el.dataset.kind; let v = el.value;
    if (k === "num") v = el.value === "" ? "" : Number(el.value); else if (k === "lines") v = el.value.split("\n");
    setPath(S.editor.draft, el.dataset.path, v);
    if (el.dataset.path === "title") { const h = $("h1", $("#view")); if (h) h.textContent = el.value || "Sem título"; }
  }
  if (el.dataset.actInput === "notes") { const r = curRun(); if (r) { r.notes = el.value; saveProg(); } }
  if (el.dataset.actInput === "newsq") { S.ui.q = el.value; clearTimeout(ACT._nq); ACT._nq = setTimeout(() => { const pos = el.selectionStart; render(true); const n = $("#news-q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === "assist") { const q = $("#assist-q").value.trim(); if (q) askAssist(f.dataset.id, q); }
});
document.addEventListener("keydown", e => { if (e.key !== "Escape") return; if (S.ui.modal) { S.ui.modal = null; renderModal(); } else if (S.ui.more) { S.ui.more = false; renderChrome(); } });
async function uploadImg(el) {
  const file = el.files[0]; if (file.size > 20 * 1024 * 1024) { toast("Imagem acima de 20 MB."); return; }
  toast("Enviando imagem…");
  try { const r = await S.assets.upload(file); setPath(S.editor.draft, el.dataset.path, r.id); toast("Imagem enviada"); render(true); }
  catch (e) { toast("Não foi possível enviar a imagem."); }
}

/* ================= INICIALIZAÇÃO ================= */
async function startLocal() {
  S.mode = "local";
  if (DESK) { try { const raw = await DESK.load(); DSTORE = raw ? JSON.parse(raw) : {}; } catch (e) { DSTORE = {}; } S.prog = Object.assign(defProg(), lsGet("volter.prog", {})); }
  if (!S.prog.projects) S.prog.projects = {};
  localLoad();
  S.dbState = Object.values(S.content).some(a => a.length) ? "ok" : "none";
  if (/(^|[#&])admin\b/.test(location.hash.slice(1))) lsSet("volter.admin", true);
  S.admin = !!lsGet("volter.admin", false);
  render(true);
}
async function boot() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") { startLocal(); return; }
  S.mode = "claude"; render(true);
  const use = n => cl.use(n).catch(() => null);
  const [db, user] = await Promise.all([use("db"), use("user")]);
  S.db = db; S.user = user;
  if (user) { try { S.uid = await user.id(); S.admin = await user.canEdit(); } catch (e) {} }
  if (!db) { S.dbState = "none"; render(); }
  else {
    S.dbState = "ok";
    COLLS.forEach(t => db.collection(t).onSnapshot(snap => {
      S.content[t] = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data())); render();
    }, () => render()));
    if (S.uid) {
      try { const snap = await db.doc("data/users/" + S.uid + "/main").get();
        if (snap.exists) { const remote = Object.assign(defProg(), clone(snap.data())); if (String(remote.updatedAt) >= String(S.prog.updatedAt)) S.prog = remote; else saveProg(); S.progWhere = "conta"; }
        else if (S.prog.updatedAt) saveProg();
      } catch (e) {}
    }
    if (!S.prog.projects) S.prog.projects = {};
    render();
  }
  const [assets, sample] = await Promise.all([S.admin ? use("assets") : null, use("sample")]);
  S.assets = assets; S.sample = sample; render();
}
boot();
</script>
