<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%221%22 y=%221%22 width=%2230%22 height=%2230%22 rx=%228%22 fill=%22%23151a2b%22/%3E%3Cpath d=%22M8.5 9 L16 24 L23.5 9%22 fill=%22none%22 stroke=%22%23eef1f7%22 stroke-width=%223%22 stroke-linejoin=%22round%22 stroke-linecap=%22round%22/%3E%3Ccircle cx=%228.5%22 cy=%229%22 r=%222.4%22 fill=%22%23b69cff%22/%3E%3Ccircle cx=%2223.5%22 cy=%229%22 r=%222.4%22 fill=%22%235cc8ff%22/%3E%3Ccircle cx=%2216%22 cy=%2224%22 r=%222.4%22 fill=%22%234fe3a6%22/%3E%3Ccircle cx=%2216%22 cy=%229%22 r=%222.4%22 fill=%22%23ffcb5c%22/%3E%3C/svg%3E">
<title>Volter</title>
<meta name="description" content="Volter — aprenda IA, programação, dados e IoT resolvendo problemas reais.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral fixa à esquerda (desktop) ou barra inferior (celular); conteúdo alinhado à esquerda, até 1180px.
   Identidade: azul-grafite com quatro cores de trilha (IA, Programação, Dados, IoT) que juntas formam a marca. */
:root{
  --bg:#0e1220; --bg-2:#0a0d18; --surface:#151a2b; --surface-2:#1c2236; --line:#273049; --line-2:#323c5a;
  --ink:#eef1f7; --muted:#97a3bb; --dim:#6c7892;
  --primary:#eef1f7; --primary-ink:#0e1220; --focus:#8fb4ff;
  --ia:#b69cff; --prog:#5cc8ff; --dados:#ffcb5c; --iot:#4fe3a6;
  --ok:#6fe0a0; --warn:#ffb35c; --bad:#ff7a85;
  --code-bg:#090c16;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px; --side-w:248px; --tab-h:62px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.6;margin:0;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:2.5rem} h2{font-size:1.75rem} h3{font-size:1.2rem} h4{font-size:1.02rem}
p{margin:0}
a{color:var(--focus)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:.88rem}
.label{font-size:.84rem;color:var(--muted);font-weight:500}
code,.mono{font-family:var(--f-mono);font-size:.9em}
:not(pre) > code{background:var(--surface-2);border:1px solid var(--line);border-radius:5px;padding:1px 5px}

/* trilhas */
[data-t="ia"]{--t:var(--ia)} [data-t="prog"]{--t:var(--prog)} [data-t="dados"]{--t:var(--dados)} [data-t="iot"]{--t:var(--iot)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--t,var(--muted));flex-shrink:0;display:inline-block}
.tchip{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;color:var(--t,var(--muted));font-weight:500;white-space:nowrap}
.spectrum{display:flex;height:4px;border-radius:2px;overflow:hidden}
.spectrum i{flex:1}
.spectrum i:nth-child(1){background:var(--ia)} .spectrum i:nth-child(2){background:var(--prog)} .spectrum i:nth-child(3){background:var(--dados)} .spectrum i:nth-child(4){background:var(--iot)}

/* ===== casca ===== */
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--bg-2);display:flex;flex-direction:column;z-index:15;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;background:none;border:0;cursor:pointer;color:inherit;padding:22px 20px 16px;text-align:left}
.brand svg{width:34px;height:34px;flex-shrink:0}
.brand b{font-family:var(--f-display);font-size:1.5rem;font-weight:800;letter-spacing:-.02em;display:block;line-height:1}
.brand small{font-size:.74rem;color:var(--muted)}
.side .spectrum{margin:0 20px 10px}
.snav{flex:1;overflow-y:auto;padding:6px 12px 12px;display:flex;flex-direction:column;gap:2px}
.snav .grp{font-size:.76rem;color:var(--dim);padding:16px 10px 6px;font-weight:500}
.snav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;font-size:.94rem;width:100%}
.snav button svg{width:18px;height:18px;flex-shrink:0}
.snav button:hover{color:var(--ink);background:var(--surface)}
.snav button[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.snav .count{margin-left:auto;font-size:.76rem;color:var(--dim)}
.sfoot{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.lvrow{display:flex;justify-content:space-between;align-items:baseline}
.lvrow b{font-family:var(--f-display);font-size:1.1rem}
.xpbar{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ia),var(--prog),var(--dados),var(--iot))}
.sfoot .meta{font-size:.76rem;color:var(--dim);display:flex;justify-content:space-between;gap:8px}
.sfoot .meta button{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font:inherit;text-decoration:underline;text-underline-offset:2px}
.topbar{display:none}
.wrap{margin-left:var(--side-w)}
main{max-width:1180px;padding-block:36px 80px;padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:30px}
.tabbar,.sheet{display:none}
@media (max-width:980px){
  .side{display:none} .wrap{margin-left:0}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--bg-2);border-bottom:1px solid var(--line);align-items:center;justify-content:space-between;gap:12px;padding-block:6px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand{padding:6px 0} .topbar .brand svg{width:28px;height:28px} .topbar .brand b{font-size:1.25rem}
  .topbar .lv{font-size:.8rem;color:var(--muted)}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:13;background:var(--bg-2)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px));gap:22px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:14;background:var(--bg-2);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{background:none;border:0;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:.7rem;cursor:pointer;min-height:var(--tab-h)}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .sheet{display:block;position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:14;background:var(--bg-2);border-top:1px solid var(--line);padding:10px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));box-shadow:0 -16px 40px rgba(0,0,0,.45)}
  .sheet .snav{padding:0}
  h1{font-size:2rem}
}

/* ===== componentes ===== */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:1120px){.split{grid-template-columns:1fr}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.page-head .lead{max-width:62ch;color:var(--muted);margin-top:10px;font-size:1.02rem}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-size:.88rem;margin-bottom:12px;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.panel > h3:first-child{margin-bottom:14px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.ph h3{margin:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-2);background:transparent;color:var(--ink);padding:8px 15px;border-radius:8px;cursor:pointer;font-weight:500;font-size:.92rem;text-decoration:none;white-space:nowrap;min-height:38px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary);font-weight:600}
.btn.primary:hover{background:#ffffff}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.sm{padding:4px 11px;font-size:.84rem;min-height:30px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.76rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted);white-space:nowrap;line-height:1.55}
.chip.ok{border-color:color-mix(in srgb,var(--ok) 50%,transparent);color:var(--ok)}
.chip.go{border-color:color-mix(in srgb,var(--prog) 50%,transparent);color:var(--prog)}
.chip.bad{border-color:color-mix(in srgb,var(--bad) 50%,transparent);color:var(--bad)}
.chip.demo{border-style:dashed}
.chip.st-review{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 50%,transparent)} .chip.st-published{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 50%,transparent)} .chip.st-archived{border-style:dashed}
.lvl{display:inline-flex;gap:2px;align-items:flex-end;vertical-align:middle}
.lvl i{width:4px;background:var(--line-2);border-radius:1px}
.lvl i:nth-child(1){height:5px}.lvl i:nth-child(2){height:7px}.lvl i:nth-child(3){height:9px}.lvl i:nth-child(4){height:11px}.lvl i:nth-child(5){height:13px}
.lvl i.on{background:var(--t,var(--ink))}
.notice{border:1px solid var(--line-2);background:var(--surface);padding:11px 15px;border-radius:8px;font-size:.92rem;color:var(--muted)}
.notice.bad{border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--ink);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.notice.ok{border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ink);background:color-mix(in srgb,var(--ok) 10%,var(--surface))}
.notice.warn{border-color:color-mix(in srgb,var(--warn) 45%,transparent);color:var(--ink);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.list{display:flex;flex-direction:column}
.list > *{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);min-width:0}
.list > *:last-child{border-bottom:0}
.link{background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer;font-weight:500;min-width:0}
.link:hover{color:var(--focus)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{background:transparent;border:1px solid var(--line-2);color:var(--muted);padding:6px 13px;border-radius:999px;cursor:pointer;font-size:.86rem;display:inline-flex;gap:7px;align-items:center}
.pill:hover{color:var(--ink)}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--primary-ink);border-color:var(--ink)}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{background:var(--bg);border:1px solid var(--line-2);border-radius:8px;padding:9px 11px;width:100%;min-width:0;color:var(--ink)}
textarea{min-height:84px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:6px;font-size:.88rem;font-weight:500}
label.f small{font-weight:400;color:var(--muted)}
label.chk{display:flex;gap:9px;align-items:flex-start;font-size:.94rem;cursor:pointer}
label.chk input{margin-top:5px;accent-color:var(--ink)}

/* código */
.codebox{position:relative;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.codebox pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--f-mono);font-size:.86rem;line-height:1.6;color:#d7deee}
.codebox .cp{position:absolute;top:8px;right:8px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--muted);border-radius:6px;font-size:.74rem;padding:2px 8px;cursor:pointer}
.codebox .cp:hover{color:var(--ink)}
.out{font-family:var(--f-mono);font-size:.84rem;background:var(--code-bg);color:#cfe3ff;border:1px solid var(--line);border-radius:6px;padding:7px 11px;display:inline-block;align-self:flex-start;white-space:pre-wrap}
.out::before{content:"› ";color:var(--dim)}

/* ===== início ===== */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:36px;align-items:center;padding-top:8px}
@media (max-width:1120px){.hero{grid-template-columns:1fr;gap:26px}}
.hero h1{font-size:3.4rem;font-weight:800;line-height:1;letter-spacing:-.03em}
@media (max-width:980px){.hero h1{font-size:2.5rem}}
.hero .lead{color:var(--muted);font-size:1.08rem;max-width:46ch;margin-top:16px}
.hero .row{margin-top:24px}
.editor{background:var(--code-bg);border:1px solid var(--line-2);border-radius:12px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.7)}
.ed-top{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.ed-top i{width:10px;height:10px;border-radius:50%;background:var(--line-2)}
.ed-top span{margin-left:8px;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}
.ed-code{padding:14px 0;font-family:var(--f-mono);font-size:.86rem;line-height:1.75;overflow-x:auto}
.ed-code div{display:grid;grid-template-columns:42px 1fr;white-space:pre;padding-right:16px}
.ed-code div b{font-weight:400;color:var(--dim);text-align:right;padding-right:16px;user-select:none}
.ed-code .k{color:var(--ia)} .ed-code .s{color:var(--iot)} .ed-code .f{color:var(--prog)}
.ed-code .bug{text-decoration:underline wavy var(--bad);text-underline-offset:4px}
.ed-code div.hl{background:color-mix(in srgb,var(--bad) 10%,transparent)}
@media (max-width:560px){.ed-code{font-size:.7rem}.ed-code div{grid-template-columns:28px 1fr;padding-right:10px}.ed-code div b{padding-right:8px}}
.ed-out{border-top:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--bg-2)}
.ed-out code{background:none;border:0;padding:0;color:var(--bad);font-size:.92rem}
.tracks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1120px){.tracks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.tracks{grid-template-columns:1fr}}
.track{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;text-align:left;cursor:pointer;color:inherit;display:flex;flex-direction:column;gap:10px;overflow:hidden;min-width:0}
.track::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:var(--t)}
.track:hover{border-color:var(--line-2);background:var(--surface-2)}
.track .ico{width:38px;height:38px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--t) 16%,transparent);color:var(--t)}
.track .ico svg{width:21px;height:21px}
.track h3{font-size:1.15rem}
.track p{font-size:.88rem;color:var(--muted)}
.meter{height:5px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;background:var(--t,var(--ink))}
.stats{display:flex;gap:34px;flex-wrap:wrap;padding:4px 2px}
.stat b{display:block;font-family:var(--f-display);font-size:1.9rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:.86rem;color:var(--muted)}

/* ===== laboratório: lista de issues ===== */
.issues{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.issue{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:14px;align-items:start;padding:16px 18px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:inherit}
.issue:last-child{border-bottom:0}
.issue:hover{background:var(--surface-2)}
.issue .state{width:18px;height:18px;border-radius:50%;border:2px solid var(--t);margin-top:3px;display:grid;place-items:center}
.issue .state.done{background:var(--t)}
.issue .state.done::after{content:"";width:6px;height:6px;background:var(--surface);border-radius:50%}
.issue h3{font-size:1.08rem;font-family:var(--f-body);font-weight:600;letter-spacing:0}
.issue .sys{font-size:.86rem;color:var(--muted);margin-top:2px}
.issue .meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;font-size:.82rem;color:var(--dim)}
.issue .right{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
@media (max-width:640px){.issue{grid-template-columns:22px minmax(0,1fr)}.issue .right{grid-column:2;align-items:flex-start;flex-direction:row}}

/* ===== bancada (lab) ===== */
.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative}
.stepper::before{content:"";position:absolute;left:calc(100%/14);right:calc(100%/14);top:15px;height:2px;background:var(--line-2)}
.stepper .prog{position:absolute;left:calc(100%/14);top:15px;height:2px;background:var(--t,var(--ink))}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--dim);min-width:0}
.step[disabled]{cursor:default}
.step .num{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line-2);font-size:.82rem;font-weight:600}
.step.done .num{border-color:var(--t,var(--ink));color:var(--t,var(--ink))}
.step.cur .num{background:var(--t,var(--ink));border-color:var(--t,var(--ink));color:var(--primary-ink)}
.step .lb{font-size:.84rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step.cur .lb{color:var(--ink)}
@media (max-width:700px){.step .lb{display:none}.step.cur .lb{display:block;position:absolute;top:38px;white-space:nowrap;overflow:visible}.stepper{padding-bottom:22px}}
.bench{display:grid;grid-template-columns:350px minmax(0,1fr);gap:22px;align-items:start}
.bench > aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
@media (max-width:1120px){.bench{grid-template-columns:1fr}.bench > aside{position:static;max-height:none;order:2}.bench.s1 > aside{order:0}}
.ficha dl{display:flex;flex-direction:column;gap:13px;margin:0}
.ficha dt{font-size:.8rem;color:var(--dim);font-weight:500}
.ficha dd{margin:3px 0 0;font-size:.92rem}
.ficha ul,.prose ul{margin:4px 0 0;padding-left:18px}
.ficha li,.prose li{margin:3px 0}
details.fold summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:1.2rem;font-weight:700}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";color:var(--muted)}
details.fold[open] summary::after{content:"−"}

<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>");
const clone = o => JSON.parse(JSON.stringify(o));
const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
const clean = a => arr(a).map(s => String(s).trim()).filter(Boolean);
const uid8 = () => Math.random().toString(36).slice(2, 10);
const slug = s => String(s || "item").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "item";
const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso); return isNaN(d) ? "" : d.toLocaleDateString("pt-BR", { day: "numeric", month: "short", year: "numeric" }); };
const getPath = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
const setPath = (o, p, v) => { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; }); a[ks[ks.length - 1]] = v; };
/* armazenamento: no programa instalado (Electron) os dados vão para um arquivo com cópias diárias; no navegador, localStorage */
const DESK = window.volterDesktop || null;
let DSTORE = null, dTimer = null;
const dFlush = () => { clearTimeout(dTimer); dTimer = null; if (DESK && DSTORE) DESK.saveSync(JSON.stringify(DSTORE)); };
const lsGet = (k, d) => { if (DSTORE) return k in DSTORE ? clone(DSTORE[k]) : d; try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { if (DSTORE) { DSTORE[k] = clone(v); clearTimeout(dTimer); dTimer = setTimeout(dFlush, 400); return; } try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { if (DSTORE) { delete DSTORE[k]; dFlush(); return; } try { localStorage.removeItem(k); } catch (e) {} };
window.addEventListener("beforeunload", () => { if (dTimer) dFlush(); });
function codeBox(code) { return '<div class="codebox"><button class="cp" type="button" data-act="copy">Copiar</button><pre><code>' + esc(code) + "</code></pre></div>"; }
function md(t) {
  const blocks = []; const src = String(t || "").replace(/```[a-z]*\n([\s\S]*?)```/g, (m, code) => { blocks.push(code.replace(/\n$/, "")); return "\n\n@@CODE" + (blocks.length - 1) + "@@\n\n"; });
  return src.split(/\n\s*\n/).map(b => {
    const tb = b.trim(); const cm = tb.match(/^@@CODE(\d+)@@$/); if (cm) return codeBox(blocks[+cm[1]]);
    if (!tb) return "";
    const lines = b.split("\n");
    if (lines[0].startsWith("## ")) { const rest = lines.slice(1).join("\n"); return "<h3>" + inl(lines[0].slice(3)) + "</h3>" + (rest.trim() ? md(rest) : ""); }
    const out = []; let para = [], list = [];
    const flushP = () => { if (para.length) { out.push("<p>" + inl(para.join(" ")) + "</p>"); para = []; } };
    const flushL = () => { if (list.length) { out.push("<ul>" + list.map(x => "<li>" + inl(x) + "</li>").join("") + "</ul>"); list = []; } };
    lines.forEach(l => { const s = l.trim(); if (s.startsWith("- ")) { flushP(); list.push(s.slice(2)); } else if (s) { flushL(); para.push(s); } });
    flushP(); flushL(); return out.join("");
  }).join("");
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

/* ---------- vocabulário ---------- */
const TRACKS = [
  { id: "ia", name: "IA, agentes e automação", short: "IA e agentes", ico: "ia", desc: "Modelos de linguagem, prompts, agentes, RAG e automações com n8n." },
  { id: "prog", name: "Programação: Python e web", short: "Programação", ico: "codigo", desc: "Lógica, Python, HTML, CSS, JavaScript e APIs." },
  { id: "dados", name: "Dados e análise", short: "Dados", ico: "dados", desc: "Tabelas, SQL, pandas e gráficos que respondem perguntas." },
  { id: "iot", name: "IoT e robótica", short: "IoT e robótica", ico: "chip", desc: "ESP32, sensores, Wi-Fi, MQTT e dispositivos conectados." }
];
const trackOf = id => TRACKS.find(t => t.id === id) || TRACKS[0];
const LEVELS = [[1, "1 · Primeiros passos"], [2, "2 · Básico"], [3, "3 · Intermediário"], [4, "4 · Avançado"], [5, "5 · Profissional"]];
const LEVEL_NAME = { 1: "Primeiros passos", 2: "Básico", 3: "Intermediário", 4: "Avançado", 5: "Profissional" };
const NEWS_CATS = ["IA e agentes", "Programação e web", "Dados e análise", "IoT e robótica", "Carreira e mercado", "Ferramentas e lançamentos"];
const NEWS_T = { "IA e agentes": "ia", "Programação e web": "prog", "Dados e análise": "dados", "IoT e robótica": "iot" };
const BOOK_AREAS = ["IA e agentes", "Programação", "Dados e análise", "IoT e robótica", "Carreira"];
const BOOK_T = { "IA e agentes": "ia", "Programação": "prog", "Dados e análise": "dados", "IoT e robótica": "iot" };
const TESTVAL = [["util", "Útil: aproxima da causa"], ["neutro", "Neutro: válido, elimina pouco"], ["irrelevante", "Irrelevante: perda de tempo"], ["inseguro", "Inseguro: penaliza e não executa"]];

const COLLS = ["cases", "lessons", "projects", "news", "books"];

const lvl = n => '<span class="lvl" title="Nível ' + n + '">' + [1, 2, 3, 4, 5].map(i => '<i class="' + (i <= n ? "on" : "") + '"></i>').join("") + "</span>";
const tchip = id => { const t = trackOf(id); return '<span class="tchip" data-t="' + t.id + '"><span class="dot"></span>' + esc(t.short) + "</span>"; };

/* ---------- estado ---------- */
const S = {
  mode: "loading", db: null, user: null, assets: null, sample: null, uid: null, admin: false,
  dbState: "loading", content: { cases: [], lessons: [], projects: [], news: [], books: [] },
  prog: null, progWhere: "local", route: { name: "inicio", id: null },
  editor: null, quiz: null, assist: {}, ui: { track: "", level: 0, q: "", ncat: "", barea: "", ptrack: "", stab: "cases", sfilter: "", open: {}, more: false }, pending: false
};
function defProg() { return { v: 1, attempts: {}, runs: {}, favorites: [], lessons: {}, projects: {}, quick: [], recent: [], settings: { hintPenalty: true }, updatedAt: "" }; }
S.prog = Object.assign(defProg(), lsGet("volter.prog", {}));
let pushQ = Promise.resolve(), pushT = null;
function saveProg() {
  S.prog.updatedAt = new Date().toISOString();
  lsSet("volter.prog", S.prog);
  clearTimeout(pushT); pushT = setTimeout(() => { pushQ = pushQ.then(pushProg); }, 700);
}
async function pushProg() {
  if (!S.db || !S.uid || S.progWhere === "local-only") return;
  try { await S.db.doc("data/users/" + S.uid + "/main").set(clone(S.prog)); S.progWhere = "conta"; }
  catch (e) { S.progWhere = "local-only"; }
}

/* ---------- conteúdo ---------- */
const all = t => S.content[t];
const pub = t => S.content[t].filter(x => x.status === "published");
const find = (t, id) => S.content[t].find(x => x.id === id);
const visible = (t, id) => { const x = find(t, id); return x && (x.status === "published" || S.admin) ? x : null; };
const isFav = k => S.prog.favorites.includes(k);
function favBtn(k) { const on = isFav(k); return '<button class="fav" data-act="fav" data-k="' + esc(k) + '" aria-pressed="' + on + '">' + (on ? "★ Salvo" : "☆ Salvar") + "</button>"; }
function localLoad() {
  const seed = window.VOLTER_SEED || {}; const ov = lsGet("volter.content", {});
  COLLS.forEach(t => {
    const base = Object.assign({}, seed[t] || {}, ov[t] || {});
    S.content[t] = Object.entries(base).filter(([, d]) => d).map(([id, d]) => Object.assign({ id }, d));
  });
}
function localWrite(t, id, doc) { const ov = lsGet("volter.content", {}); ov[t] = ov[t] || {}; ov[t][id] = doc; lsSet("volter.content", ov); }
function exportContent() {
  const out = {}; COLLS.forEach(t => { out[t] = {}; S.content[t].forEach(x => { const d = clone(x); delete d.id; out[t][x.id] = d; }); });
  const js = "// Conteúdo do Volter, gerado pelo editor em " + new Date().toLocaleString("pt-BR") + "\nwindow.VOLTER_SEED = " + JSON.stringify(out, null, 1) + ";\n";
  if (DESK && DESK.saveFile) { DESK.saveFile("conteudo.js", js).then(r => toast(r && r.saved ? "conteudo.js salvo" : "Exportação cancelada")); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([js], { type: "text/javascript" })); a.download = "conteudo.js"; document.body.appendChild(a); a.click(); a.remove();
  toast("Arquivo conteudo.js gerado");
}
const tracksLessons = id => pub("lessons").filter(l => l.track === id).sort((a, b) => (a.order || 0) - (b.order || 0));
const lessonDone = id => !!(S.prog.lessons[id] && S.prog.lessons[id].done);
const trackPct = id => { const ls = tracksLessons(id); return ls.length ? Math.round(ls.filter(l => lessonDone(l.id)).length / ls.length * 100) : 0; };

];
const TABS = [["inicio", "Início"], ["trilhas", "Trilhas"], ["lab", "Lab"], ["progresso", "Progresso"]];
function go(name, id) { S.route = { name, id: id || null }; S.ui.more = false; window.scrollTo(0, 0); render(true); }
function navGroup() { return { caso: "lab", correcao: "lab", licao: "trilhas", trilha: "trilhas", projeto: "projetos", editor: "admin" }[S.route.name] || S.route.name; }

/* ---------- render ---------- */
function render(force) {
  const ae = document.activeElement;
  if (!force && ae && $("#view").contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName) && ae.type !== "checkbox") { S.pending = true; return; }
  S.pending = false;
  renderChrome();
  let html;
  try { html = (VIEWS[S.route.name] || VIEWS.inicio)(S.route.id); }
  catch (e) { console.error(e); html = '<div class="notice bad">Não foi possível abrir esta tela: ' + esc(e.message) + '</div><div><button class="btn" data-act="go" data-r="inicio">Voltar ao início</button></div>'; }
  $("#view").innerHTML = html;
}
document.addEventListener("focusout", () => setTimeout(() => { if (S.pending) render(); }, 50));
function navItems() { const g = NAVDEF.slice(); if (S.admin) g.push(["Gestão", [["admin", S.mode === "local" ? "Editor de conteúdo" : "Administração"]]]); return g; }
function renderChrome() {
  const grp = navGroup();
  const counts = { lab: pub("cases").length, projetos: pub("projects").length, noticias: pub("news").length, livros: pub("books").length, favoritos: S.prog.favorites.length || "" };
  const navHTML = navItems().map(([g, items]) => (g ? '<div class="grp">' + g + "</div>" : "") + items.map(([r, l]) => '<button data-act="go" data-r="' + r + '"' + (grp === r ? ' aria-current="page"' : "") + ">" + (IC[r] || "") + "<span>" + l + "</span>" + (counts[r] ? '<span class="count">' + counts[r] + "</span>" : "") + "</button>").join("")).join("");
  $("#snav").innerHTML = navHTML;
  const xp = calcXP(), lv = levelFor(xp), pct = lv.next ? Math.round((xp - lv.min) / (lv.next[0] - lv.min) * 100) : 100;
  const modeTxt = S.mode === "local" ? (DESK ? "Programa instalado" : "Versão web") : S.mode === "claude" ? (S.admin ? "Administrador" : S.uid ? "Aluno" : "Visitante") : "Carregando";
  $("#sfoot").innerHTML = '<div class="lvrow"><b>' + lv.name + '</b><span class="small muted">' + xp + ' XP</span></div><div class="xpbar"><i style="width:' + pct + '%"></i></div><span class="small dim">' + (lv.next ? "Faltam " + (lv.next[0] - xp) + " XP para " + lv.next[1] : "Nível máximo") + '</span><div class="meta"><span>' + modeTxt + '</span><button data-act="go" data-r="roteiro">Próximas etapas</button></div>';
  $("#toplv").textContent = lv.name + " · " + xp + " XP";
  const tabG = TABS.some(t => t[0] === grp) ? grp : "mais";
  $("#tabbar").innerHTML = TABS.map(([r, l]) => '<button data-act="go" data-r="' + r + '"' + (tabG === r && !S.ui.more ? ' aria-current="page"' : "") + ">" + (IC[r] || "") + l + "</button>").join("") + '<button data-act="more"' + ((tabG === "mais" || S.ui.more) ? ' aria-current="page"' : "") + ' aria-expanded="' + S.ui.more + '">' + IC.mais + "Mais</button>";
  const sh = $("#sheet"); sh.hidden = !S.ui.more;
  if (S.ui.more) sh.innerHTML = '<nav class="snav">' + navHTML + '<div class="grp">Sobre</div><button data-act="go" data-r="roteiro">' + IC.roteiro + "<span>Próximas etapas</span></button></nav>";
}
function dbNotice() {
  if (S.dbState === "loading") return '<div class="notice">Carregando conteúdo…</div>';
  if (S.dbState === "none") return '<div class="notice warn">O conteúdo do Volter não pôde ser carregado. No claude.ai, abra o app com a sua conta conectada. Na versão do GitHub, confira se o arquivo <code>data/conteudo.js</code> está junto do <code>index.html</code>.</div>';
  return "";
}
function emptyBox(msg, act) { return '<div class="empty"><p>' + msg + "</p>" + (act || "") + "</div>"; }
function head(title, lead, right, back, pre) {
  return '<div class="page-head"><div style="min-width:0">' + (back ? '<button class="back" data-act="go" data-r="' + back[0] + '"' + (back[2] ? ' data-id="' + esc(back[2]) + '"' : "") + ">← " + back[1] + "</button><br>" : "") + (pre ? '<div style="margin-bottom:8px">' + pre + "</div>" : "") + "<h1>" + title + "</h1>" + (lead ? '<p class="lead">' + lead + "</p>" : "") + "</div>" + (right ? '<div class="row">' + right + "</div>" : "") + "</div>";
}

/* ================= TELAS ================= */
const VIEWS = {};
const caseNo = c => "#" + String(pub("cases").slice().sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)) || a.id.localeCompare(b.id)).findIndex(x => x.id === c.id) + 1);
function dailyCase() { const c = pub("cases").slice().sort((a, b) => a.id.localeCompare(b.id)); if (!c.length) return null; const d = Math.floor(Date.now() / 864e5); return c[d % c.length]; }

VIEWS.inicio = () => {
  const daily = dailyCase(); const xp = calcXP(), lv = levelFor(xp);
  const solved = Object.keys(S.prog.attempts).filter(id => find("cases", id)).length;
  const lessonsDone = pub("lessons").filter(l => lessonDone(l.id)).length;
  const projDone = pub("projects").filter(p => S.prog.projects[p.id] && S.prog.projects[p.id].done).length;
  const runs = Object.keys(S.prog.runs).map(id => visible("cases", id)).filter(Boolean);
  const nextL = TRACKS.map(t => tracksLessons(t.id).find(l => !lessonDone(l.id))).filter(Boolean)[0];
  const demoCase = visible("cases", "api-campo-renomeado");
  const news = pub("news").slice().sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt))).slice(0, 3);
  const L = (n, html, cls) => '<div' + (cls ? ' class="' + cls + '"' : "") + "><b>" + n + "</b><span>" + html + "</span></div>";
  return dbNotice() +
    '<section class="hero"><div><h1>Aprenda tecnologia consertando o que quebrou.</h1><p class="lead">IA, programação, dados e IoT para quem está começando. Você aprende o conceito nas trilhas e treina no Laboratório, investigando problemas que acontecem de verdade.</p><div class="row"><button class="btn primary" data-act="go" data-r="trilhas">Escolher uma trilha</button><button class="btn" data-act="go" data-r="lab">Abrir o Laboratório</button></div></div>' +
    '<div class="editor" role="img" aria-label="Exemplo de código com um erro: o site mostra Olá, undefined"><div class="ed-top"><i></i><i></i><i></i><span>saudacao.js</span></div><div class="ed-code">' +
    L(1, '<span class="k">const</span> resposta = <span class="k">await</span> <span class="f">fetch</span>(<span class="s">"/api/usuario"</span>);') +
    L(2, '<span class="k">const</span> dados = <span class="k">await</span> resposta.<span class="f">json</span>();') +
    L(3, "") +
    L(4, 'saudacao.textContent = <span class="s">"Olá, "</span> + <span class="bug">dados.nome</span>;', "hl") +
    '</div><div class="ed-out"><span class="small muted">Na tela: <code>Olá, undefined</code></span>' + (demoCase ? '<button class="btn sm primary" data-act="go" data-r="caso" data-id="api-campo-renomeado">Descobrir o porquê</button>' : "") + "</div></div></section>" +
    '<section class="stack" style="gap:14px"><div class="ph" style="margin:0"><h2>Trilhas</h2><button class="btn sm ghost" data-act="go" data-r="trilhas">Ver todas</button></div><div class="tracks">' + TRACKS.map(t => { const ls = tracksLessons(t.id); const pct = trackPct(t.id); return '<button class="track" data-t="' + t.id + '" data-act="go" data-r="trilha" data-id="' + t.id + '"><span class="ico">' + IC[t.ico] + "</span><h3>" + esc(t.name) + "</h3><p>" + esc(t.desc) + '</p><span class="small muted">' + ls.length + " lições" + (pct ? " · " + pct + "% feito" : "") + '</span><span class="meter"><i style="width:' + pct + '%"></i></span></button>'; }).join("") + "</div></section>" +
    '<section class="stats"><div class="stat"><b>' + esc(lv.name) + '</b><span>seu nível, ' + xp + ' XP</span></div><div class="stat"><b>' + solved + "/" + pub("cases").length + '</b><span>problemas resolvidos</span></div><div class="stat"><b>' + lessonsDone + "/" + pub("lessons").length + '</b><span>lições concluídas</span></div><div class="stat"><b>' + projDone + "/" + pub("projects").length + "</b><span>projetos entregues</span></div></section>" +
    '<section class="split"><div class="stack" style="gap:22px">' +
    (daily ? '<div class="panel" data-t="' + esc(daily.track) + '"><div class="ph"><h3>Desafio do dia</h3>' + tchip(daily.track) + '</div><h2 style="font-size:1.4rem">' + esc(daily.title) + '</h2><p class="muted" style="margin-top:8px">' + esc(arr(daily.symptoms)[0] || daily.summary) + '</p><div class="row" style="margin-top:16px;justify-content:space-between"><span class="small dim">' + esc(daily.equipment) + '</span><button class="btn primary" data-act="go" data-r="caso" data-id="' + esc(daily.id) + '">' + (S.prog.attempts[daily.id] ? "Resolver de novo" : "Investigar") + "</button></div></div>" : "") +
    '<div class="panel"><div class="ph"><h3>Continue de onde parou</h3></div><div class="list">' +
    (runs.map(c => '<div data-t="' + esc(c.track) + '"><button class="link" data-act="go" data-r="caso" data-id="' + esc(c.id) + '">' + esc(c.title) + '</button><span class="chip">etapa ' + S.prog.runs[c.id].stage + " de 7</span></div>").join("") +
      (nextL ? '<div><div style="min-width:0">' + tchip(nextL.track) + '<br><button class="link" data-act="go" data-r="licao" data-id="' + esc(nextL.id) + '">' + esc(nextL.title) + '</button></div><span class="small dim">' + (nextL.minutes || 5) + " min</span></div>" : "") ||
      '<div><span class="muted">Nada em andamento. Escolha uma trilha para começar.</span></div>') + "</div></div></div>" +
    '<div class="panel"><div class="ph"><h3>Notícias</h3><button class="btn sm ghost" data-act="go" data-r="noticias">Todas</button></div><div class="list">' + (news.map(n => '<div style="flex-direction:column;align-items:flex-start;gap:4px"><span class="tchip" data-t="' + (NEWS_T[n.category] || "") + '"><span class="dot"></span>' + esc(n.category) + '</span><button class="link" data-act="go" data-r="noticias">' + esc(n.title) + '</button><span class="small dim">' + esc(n.sourceName) + (n.publishedAt ? ", " + fmtDate(n.publishedAt) : "") + "</span></div>").join("") || '<div class="muted">Sem notícias publicadas.</div>') + "</div></div></section>";
};

/* ----- Laboratório ----- */
VIEWS.lab = () => {
  const u = S.ui;
  let list = pub("cases").filter(c => (!u.track || c.track === u.track) && (!u.level || c.level === u.level));
  list.sort((a, b) => (a.level - b.level) || a.title.localeCompare(b.title));
  return dbNotice() + head("Laboratório", "Problemas reais para investigar. Você levanta hipóteses, escolhe o que verificar, interpreta o que encontrou e só então descobre a causa. A nota valoriza o raciocínio, não a velocidade.") +
    '<div class="filters"><button class="pill" data-act="ui" data-k="track" data-v="" aria-pressed="' + (!u.track) + '">Todas as trilhas</button>' + TRACKS.map(t => '<button class="pill" data-t="' + t.id + '" data-act="ui" data-k="track" data-v="' + t.id + '" aria-pressed="' + (u.track === t.id) + '"><span class="dot"></span>' + esc(t.short) + "</button>").join("") + "</div>" +
    (list.length ? '<div class="issues">' + list.map(issueRow).join("") + "</div>" : emptyBox(S.dbState === "ok" ? "Nenhum desafio com esse filtro." : "Os desafios aparecem aqui quando o conteúdo carregar."));
};
function issueRow(c) {
  const at = S.prog.attempts[c.id], run = S.prog.runs[c.id];
  const best = at && at.length ? Math.max(...at.map(a => a.score)) : null;
  const st = run ? '<span class="chip go">Em andamento</span>' : best != null ? '<span class="chip ok">Resolvido, ' + best + " pts</span>" : '<span class="chip">Aberto</span>';
  return '<button class="issue" data-t="' + esc(c.track) + '" data-act="go" data-r="caso" data-id="' + esc(c.id) + '"><span class="state' + (best != null ? " done" : "") + '"></span><div style="min-width:0"><h3>' + esc(c.title) + '</h3><div class="sys">' + esc(c.equipment) + '</div><div class="meta"><span>' + caseNo(c) + "</span>" + tchip(c.track) + "<span>" + esc(LEVEL_NAME[c.level] || "") + "</span>" + (c.demo ? '<span class="chip demo">Exemplo</span>' : "") + '</div></div><div class="right">' + st + lvl(c.level) + "</div></button>";
}
function fichaInner(c) {
  const li = a => "<ul>" + arr(a).map(s => "<li>" + inl(s) + "</li>").join("") + "</ul>";
  return "<dl><div><dt>Sistema</dt><dd>" + esc(c.equipment) + "</dd></div><div><dt>Cenário</dt><dd>" + esc(c.context) + "</dd></div><div><dt>Sintomas</dt><dd>" + li(c.symptoms) + "</dd></div><div><dt>O que mudou</dt><dd>" + esc(c.history) + "</dd></div><div><dt>Quando acontece</dt><dd>" + esc(c.conditions) + "</dd></div>" +
    (arr(c.techInfo).length ? "<div><dt>Detalhes técnicos</dt><dd>" + li(c.techInfo) + "</dd></div>" : "") +
    (c.image ? '<div><dt>Imagem</dt><dd><img style="width:100%;border-radius:8px" src="/_blob/' + esc(c.image) + '" alt="Imagem do desafio"></dd></div>' : "") +
    "<div><dt>Objetivo</dt><dd>" + esc(c.objective) + "</dd></div></dl>";
}
function fichaHTML(c) { return '<div class="panel ficha"><div class="ph"><h3>Cenário</h3>' + (c.demo ? '<span class="chip demo">Exemplo</span>' : "") + "</div>" + fichaInner(c) + "</div>"; }

VIEWS.caso = id => {
  const c = visible("cases", id);

/* ----- Progresso ----- */
function calcXP() { let x = 0; for (const id in S.prog.attempts) { const a = S.prog.attempts[id]; if (a.length) x += Math.max(...a.map(t => t.score)); } for (const id in S.prog.lessons) if (S.prog.lessons[id].done) x += 20; for (const id in (S.prog.projects || {})) if (S.prog.projects[id].done) x += 50; return x; }
const LV = [[0, "Explorador"], [150, "Aprendiz"], [400, "Construtor"], [800, "Desenvolvedor"], [1400, "Especialista"]];
function levelFor(x) { let r = LV[0]; LV.forEach(l => { if (x >= l[0]) r = l; }); const i = LV.indexOf(r); return { name: r[1], min: r[0], next: LV[i + 1] }; }
VIEWS.progresso = () => {
  const xp = calcXP(), lv = levelFor(xp);
  const atts = Object.entries(S.prog.attempts).filter(([id]) => find("cases", id)).flatMap(([id, a]) => a.map(t => Object.assign({ id }, t)));
  const comp = k => { const v = atts.map(a => a.parts[k] / ({ hyp: 20, inv: 30, diag: 30, sol: 20, seg: 100 })[k]); return v.length ? Math.round(v.reduce((s, x) => s + x, 0) / v.length * 100) : 0; };
  const last = {}; atts.forEach(a => last[a.id] = a);
  const anyTrack = TRACKS.some(t => { const ls = tracksLessons(t.id); return ls.length && ls.every(l => lessonDone(l.id)); });
  const projDone = Object.values(S.prog.projects || {}).some(p => p.done);
  const badges = [["1º", "Primeiro problema resolvido", "Concluiu um desafio do Laboratório", atts.length > 0], ["IN", "Investigação certeira", "90% ou mais na investigação", atts.some(a => a.parts.inv >= 27)], ["SG", "Sem atalhos", "3 desafios sem ação insegura", Object.values(last).filter(a => !a.unsafe).length >= 3], ["SD", "Sem dicas", "Acertou a causa sem pedir dica", atts.some(a => !a.hints && a.parts.diag)], ["✓", "Trilha concluída", "Todas as lições de uma trilha", !!anyTrack], ["PJ", "Projeto entregue", "Concluiu um projeto guiado", projDone], ["5/5", "Treino perfeito", "5 de 5 no treino rápido", S.prog.quick.some(q => q.score === q.total && q.total >= 5)]];
  const where = S.mode === "local" ? (DESK ? "Seu progresso fica salvo neste computador, com uma cópia automática por dia." : "Seu progresso fica salvo neste navegador.") : S.progWhere === "conta" ? "Seu progresso está salvo na sua conta e acompanha você em outros dispositivos." : S.uid && S.progWhere !== "local-only" ? "Sincronizando com a sua conta…" : "Seu progresso está salvo apenas neste navegador.";
  return head("Meu progresso", where) +
    '<section class="stats"><div class="stat"><b>' + lv.name + "</b><span>" + (lv.next ? "faltam " + (lv.next[0] - xp) + " XP para " + lv.next[1] : "nível máximo") + '</span></div><div class="stat"><b>' + xp + '</b><span>XP</span></div><div class="stat"><b>' + atts.length + '</b><span>investigações</span></div><div class="stat"><b>' + Object.values(S.prog.lessons).filter(l => l.done).length + "</b><span>lições</span></div></section>" +
    '<div class="split"><div class="stack" style="gap:18px"><div class="panel"><h3>Trilhas</h3><div class="bars">' + TRACKS.map(t => { const v = trackPct(t.id); return '<div class="bar" data-t="' + t.id + '"><span>' + esc(t.short) + '</span><span class="tr"><i style="width:' + v + '%"></i></span><span class="v">' + v + "%</span></div>"; }).join("") + "</div></div>" +

function fieldHTML(f, val, path) {

  if (["text", "url", "date", "number"].includes(f.t)) return wrap('<input id="' + id + '" type="' + f.t + '" data-path="' + path + '" data-kind="' + (f.t === "number" ? "num" : "str") + '" value="' + esc(val) + '">');
  if (f.t === "textarea") return wrap('<textarea id="' + id + '" rows="' + (f.rows || 3) + '" data-path="' + path + '" data-kind="str">' + esc(val) + "</textarea>");
  if (f.t === "lines") return wrap('<textarea id="' + id + '" rows="4" data-path="' + path + '" data-kind="lines">' + esc(arr(val).join("\n")) + "</textarea>");
  if (f.t === "tags") return wrap('<input id="' + id + '" type="text" data-path="' + path + '" data-kind="tags" value="' + esc(Array.isArray(val) ? val.join(", ") : val) + '">');
  if (f.t === "select") return wrap('<select id="' + id + '" data-path="' + path + '" data-kind="' + (f.num ? "num" : "str") + '">' + f.o.map(([v, l]) => '<option value="' + esc(v) + '"' + (String(val) === String(v) ? " selected" : "") + ">" + esc(l) + "</option>").join("") + "</select>");

  return head(esc(d.title || "Sem título"), "", "", ["admin", "Conteúdo"], '<span class="small muted">' + (E.id ? "Editar " + TYPES[E.t].one : NEWLABEL(E.t)) + "</span>" + (cur ? ' <span class="chip st-' + cur.status + '">' + STATUS[cur.status] + "</span>" : "")) +
    '<div class="tabs" role="tablist"><button role="tab" aria-selected="' + (E.tab === "edit") + '" data-act="etab" data-v="edit">Editar</button><button role="tab" aria-selected="' + (E.tab === "preview") + '" data-act="etab" data-v="preview">Pré-visualizar</button></div>' +
    (E.errors.length ? '<div class="notice bad"><b>Corrija antes de salvar:</b><ul style="margin:4px 0 0;padding-left:18px">' + E.errors.map(e => "<li>" + esc(e) + "</li>").join("") + "</ul></div>" : "") + body +
    (cur && arr(cur.history).length ? '<div class="panel"><h3>Histórico</h3><div class="list">' + arr(cur.history).slice().reverse().map(h => '<div><span class="chip st-' + h.status + '">' + STATUS[h.status] + '</span><span class="small muted">' + new Date(h.at).toLocaleString("pt-BR") + "</span></div>").join("") + "</div></div>" : "") +
    '<div class="sticky-actions"><button class="btn" data-act="save" data-s="draft"' + (E.saving ? " disabled" : "") + '>Salvar rascunho</button><button class="btn" data-act="save" data-s="review"' + (E.saving ? " disabled" : "") + '>Enviar para revisão</button><button class="btn primary" data-act="save" data-s="published"' + (E.saving ? " disabled" : "") + ">Publicar</button>" + (E.id ? '<button class="btn" data-act="save" data-s="archived"' + (E.saving ? " disabled" : "") + ">Arquivar</button>" : "") + '<span style="flex:1"></span>' +
    (E.id ? (E.confirmDel ? '<span class="small">Excluir de vez?</span><button class="btn danger sm" data-act="delitem">Sim, excluir</button><button class="btn sm" data-act="delcancel">Cancelar</button>' : '<button class="btn danger sm" data-act="delask">Excluir</button>') : "") + "</div>";
};
function previewHTML(t, d) {
  const x = Object.assign({ id: "preview" }, d);
  if (t === "cases") return '<div data-t="' + esc(x.track) + '">' + fichaHTML(x) + "</div>";
  if (t === "lessons") return "<h2>" + esc(x.title) + '</h2><div class="prose">' + md(x.body) + "</div>" + arr(x.questions).map((q, i) => quizQ(q, null, "noop", "p", i)).join("");
  if (t === "projects") return "<h2>" + esc(x.title) + '</h2><p>' + esc(x.goal) + '</p><ol>' + clean(x.steps).map(s => "<li>" + inl(s) + "</li>").join("") + "</ol>";
  if (t === "news") return "<h2>" + esc(x.title) + "</h2><p>" + esc(x.summary) + '</p><p class="small muted">' + esc(x.sourceName || "Sem fonte") + ", " + (fmtDate(x.publishedAt) || "sem data") + "</p><p>" + esc(x.impact) + "</p>";
  if (t === "books") return "<h2>" + esc(x.title) + "</h2><p>" + esc(x.summary) + "</p><p><b>Por que ler:</b> " + esc(x.why) + "</p>";
  return "";
}
function validate(t, d) {
  const e = [];
  if (!String(d.title || "").trim()) e.push("Informe o título.");
  if (t === "cases") {
    if (!arr(d.hypotheses).filter(h => String(h.text).trim()).length) e.push("Cadastre pelo menos uma hipótese.");
    if (!arr(d.hypotheses).some(h => h.correct)) e.push("Marque a hipótese que corresponde à causa real.");
    if (!arr(d.tests).filter(x => String(x.name).trim() && String(x.result).trim()).length) e.push("Cadastre pelo menos uma verificação com resultado.");
    if (arr(d.causes).filter(c => c.correct).length !== 1) e.push("Marque exatamente uma causa como correta.");
    if (!arr(d.actions).some(a => a.correct)) e.push("Marque pelo menos uma correção como correta.");
  }
  if (t === "lessons") arr(d.questions).forEach((q, i) => { const n = q.type === "vf" ? 2 : clean(q.options).length; if (!String(q.prompt).trim()) e.push("Exercício " + (i + 1) + ": falta o enunciado."); if (!(q.answer >= 1 && q.answer <= n)) e.push("Exercício " + (i + 1) + ": a resposta correta deve ser um número de 1 a " + n + "."); });
  if (t === "projects" && !clean(d.steps).length) e.push("Cadastre o passo a passo.");
  if ((t === "news" || t === "books") && d.url && !/^https?:\/\//.test(d.url)) e.push("O link deve começar com http:// ou https://.");
  if (t === "news" && !d.demo && !String(d.sourceName).trim()) e.push("Notícias reais precisam da fonte original. Se for um exemplo, marque \"Exemplo\".");
  return e;
}
function normalize(t, d) {
  const x = clone(d);
  const linesKeys = { cases: ["symptoms", "techInfo", "hints", "solution.logic", "solution.mistakes", "solution.lessons"], lessons: ["keypoints"], projects: ["tools", "steps"], news: [], books: [] }[t];
  linesKeys.forEach(k => setPath(x, k, clean(getPath(x, k))));
  ["tags", "keywords", "skills"].forEach(k => { if (k in x) x[k] = (Array.isArray(x[k]) ? x[k] : String(x[k]).split(",")).map(s => String(s).trim()).filter(Boolean); });
  if (t === "cases") { ["hypotheses", "causes", "actions"].forEach(k => x[k] = arr(x[k]).filter(r => String(r.text).trim())); x.tests = arr(x.tests).filter(r => String(r.name).trim()); x.level = Number(x.level) || 1; }
  if (t === "lessons") { x.questions = arr(x.questions).filter(q => String(q.prompt).trim()).map(q => Object.assign(q, { options: q.type === "vf" ? ["Verdadeiro", "Falso"] : clean(q.options), answer: Number(q.answer) })); x.order = Number(x.order) || 0; x.minutes = Number(x.minutes) || 5; }
  delete x.id;
  return x;
}
async function saveEditor(status) {
  const E = S.editor; if (!E || E.saving) return;
  E.errors = status === "draft" ? (String(E.draft.title || "").trim() ? [] : ["Informe o título."]) : validate(E.t, E.draft);
  if (E.errors.length) { render(true); return; }
  if (S.mode !== "local" && !S.db) { E.errors = ["O banco de dados não está disponível nesta visualização."]; render(true); return; }
  const now = new Date().toISOString(), prev = E.id ? find(E.t, E.id) : null;
  const doc = normalize(E.t, E.draft);
  doc.status = status; doc.updatedAt = now; doc.createdAt = prev && prev.createdAt || now; doc.author = prev && prev.author || S.uid || "";
  doc.history = arr(prev && prev.history).concat(prev && prev.status === status ? [] : [{ status, at: now }]).slice(-12);
  const id = E.id || (slug(doc.title) + "-" + uid8().slice(0, 4));
  E.saving = true; render(true);
  try {
    if (S.mode === "local") localWrite(E.t, id, doc); else await S.db.doc(E.t + "/" + id).set(doc);
    E.id = id; E.saving = false; E.errors = [];
    const ix = S.content[E.t].findIndex(x => x.id === id); const row = Object.assign({ id }, doc); if (ix >= 0) S.content[E.t][ix] = row; else S.content[E.t].push(row);
    toast({ draft: "Rascunho salvo", review: "Enviado para revisão", published: "Publicado", archived: "Arquivado" }[status]); render(true);
  } catch (e) { E.saving = false; E.errors = [e && e.code === "invalid_argument" ? "Sua conta não tem permissão para alterar o conteúdo." : e && e.code === "quota_exceeded" ? "Limite de armazenamento atingido: " + e.message : "Não foi possível salvar agora. Tente de novo."]; render(true); }
}

/* ================= EVENTOS ================= */
const ACT = {
  go: el => go(el.dataset.r, el.dataset.id),
  more: () => { S.ui.more = !S.ui.more; renderChrome(); },
  ui: el => { const k = el.dataset.k; let v = el.dataset.v; if (k === "level") v = Number(v); S.ui[k] = v; render(true); },
  toggle: el => { S.ui.open[el.dataset.k] = !S.ui.open[el.dataset.k]; render(true); },
  copy: el => { const code = el.parentElement.querySelector("code").textContent; const done = () => { el.textContent = "Copiado"; setTimeout(() => el.textContent = "Copiar", 1500); };
    try { navigator.clipboard.writeText(code).then(done, () => { const r = document.createRange(); r.selectNodeContents(el.parentElement.querySelector("code")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); el.textContent = "Selecionado"; }); } catch (e) { el.textContent = "Selecione o texto"; } },
  fav: el => { const k = el.dataset.k, f = S.prog.favorites, i = f.indexOf(k); if (i >= 0) f.splice(i, 1); else f.push(k); saveProg(); toast(i >= 0 ? "Removido dos salvos" : "Salvo"); render(true); },
  start: el => { const id = el.dataset.id; S.prog.runs[id] = { stage: 1, max: 1, hyps: [], tests: [], marks: {}, cause: null, action: null, hints: 0, notes: "", locked: false, started: new Date().toISOString() }; saveProg(); go("caso", id); },
  abandon: el => { delete S.prog.runs[el.dataset.id]; saveProg(); go("caso", el.dataset.id); },
  stage: el => { const r = curRun(); if (!r) return; const n = Number(el.dataset.n); r.stage = n; r.max = Math.max(r.max, n); saveProg(); window.scrollTo(0, 0); render(true); },
  hyp: el => { const r = curRun(); if (!r || r.locked) return; const id = el.dataset.id; r.hyps = r.hyps.includes(id) ? r.hyps.filter(x => x !== id) : r.hyps.concat(id); saveProg(); render(true); },
  runtest: el => { const r = curRun(); if (!r) return; const id = el.dataset.id; if (!r.tests.includes(id)) r.tests.push(id); const c = find("cases", S.route.id); const t = arr(c.tests).find(x => x.id === id); if (t && t.value === "inseguro") toast("Ação insegura registrada: −10 pontos"); saveProg(); render(true); },
  mark: el => { const r = curRun(); if (!r) return; r.marks[el.dataset.id] = r.marks[el.dataset.id] === el.dataset.v ? "" : el.dataset.v; saveProg(); render(true); },
  pick: el => { const r = curRun(); if (!r) return; if (el.dataset.f === "cause" && r.locked) return; r[el.dataset.f] = el.dataset.id; saveProg(); render(true); },
  lockcause: () => { const r = curRun(); if (!r || !r.cause) return; r.locked = true; r.stage = 6; r.max = 6; saveProg(); window.scrollTo(0, 0); render(true); },
  hint: () => { const r = curRun(); if (!r) return; r.hints++; saveProg(); render(true); },
  finish: () => { const id = S.route.id, r = curRun(), c = find("cases", id); if (!r || !c || !r.action) return; const sc = scoreRun(c, r); const at = { at: new Date().toISOString(), score: sc.score, parts: sc.parts, unsafe: sc.unsafe, hints: r.hints, hintPen: sc.hintPen, hyps: r.hyps, tests: r.tests, cause: r.cause, action: r.action }; (S.prog.attempts[id] = S.prog.attempts[id] || []).push(at); S.prog.attempts[id] = S.prog.attempts[id].slice(-10); delete S.prog.runs[id]; saveProg(); go("correcao", id); },
  lq: el => { const id = el.dataset.ref, qi = Number(el.dataset.qi), oi = Number(el.dataset.oi); const l = find("lessons", id); const p = S.prog.lessons[id] || (S.prog.lessons[id] = { answers: {}, done: false, score: 0 }); p.answers[qi] = oi; const qs = arr(l.questions); if (qs.every((q, i) => p.answers[i] != null)) { p.done = true; p.score = qs.filter((q, i) => p.answers[i] === Number(q.answer) - 1).length; toast("Lição concluída: +20 XP"); } saveProg(); render(true); },
  resetlesson: el => { delete S.prog.lessons[el.dataset.id]; saveProg(); render(true); },
  pstep: el => { const id = el.dataset.id, i = Number(el.dataset.i); const p = visible("projects", id); if (!p) return; const pr = S.prog.projects[id] || (S.prog.projects[id] = { steps: {}, done: false }); pr.steps[i] = el.checked; const was = pr.done; pr.done = arr(p.steps).every((s, j) => pr.steps[j]); if (pr.done && !was) toast("Projeto entregue: +50 XP"); saveProg(); render(true); },
  quizstart: () => { const pool = questionPool().sort(() => Math.random() - .5).slice(0, 5); S.quiz = { qs: pool, i: 0, answers: {} }; render(true); },
  qq: el => { S.quiz.answers[Number(el.dataset.qi)] = Number(el.dataset.oi); render(true); },
  quiznext: () => { const q = S.quiz; q.i++; if (q.i >= q.qs.length) { const sc = q.qs.filter((it, i) => q.answers[i] === Number(it.q.answer) - 1).length; S.prog.quick.push({ at: new Date().toISOString(), score: sc, total: q.qs.length }); S.prog.quick = S.prog.quick.slice(-30); saveProg(); } render(true); },
  quizclose: () => { S.quiz = null; render(true); },
  pref: el => { S.prog.settings[el.dataset.k] = el.checked; saveProg(); render(true); },
  new: el => startEditor(el.dataset.t),
  edit: el => startEditor(el.dataset.t, el.dataset.id),
  etab: el => { S.editor.tab = el.dataset.v; render(true); },
  save: el => saveEditor(el.dataset.s),
  delask: () => { S.editor.confirmDel = true; render(true); },
  delcancel: () => { S.editor.confirmDel = false; render(true); },
  delitem: async () => { const E = S.editor; try { if (S.mode === "local") localWrite(E.t, E.id, null); else await S.db.doc(E.t + "/" + E.id).delete(); S.content[E.t] = S.content[E.t].filter(x => x.id !== E.id); toast("Excluído"); S.editor = null; go("admin"); } catch (e) { E.errors = ["Não foi possível excluir."]; E.confirmDel = false; render(true); } },
  repadd: el => { const p = el.dataset.path; const a = arr(getPath(S.editor.draft, p)); a.push(SUBBLANK[p.split(".").pop()]()); setPath(S.editor.draft, p, a); render(true); },
  repdel: el => { const p = el.dataset.path; const a = arr(getPath(S.editor.draft, p)); a.splice(Number(el.dataset.i), 1); setPath(S.editor.draft, p, a); render(true); },
  repmove: el => { const p = el.dataset.path, i = Number(el.dataset.i), j = i + Number(el.dataset.d); const a = arr(getPath(S.editor.draft, p)); [a[i], a[j]] = [a[j], a[i]]; render(true); },
  rmimg: el => { setPath(S.editor.draft, el.dataset.path, ""); render(true); },
  export: () => exportContent(),
  resetlocal: el => { if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Clique de novo para confirmar"; el.classList.add("danger"); return; } lsDel("volter.content"); localLoad(); toast("Alterações locais descartadas"); render(true); },
  noop: () => {}
};
function curRun() { return S.route.name === "caso" ? S.prog.runs[S.route.id] : null; }
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act; if (!ACT[a]) return;
  if (el.tagName === "INPUT" && el.type === "checkbox" && (a === "pref" || a === "pstep")) return;
  e.preventDefault(); ACT[a](el);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "pref" || el.dataset.act === "pstep") { ACT[el.dataset.act](el); return; }
  if (el.dataset.path && S.editor) {
    const k = el.dataset.kind; let v = el.value;
    if (k === "bool") v = el.checked; else if (k === "num") v = el.value === "" ? "" : Number(el.value); else if (k === "lines") v = el.value.split("\n");
    setPath(S.editor.draft, el.dataset.path, v);
    if (el.tagName === "SELECT" && el.dataset.path.endsWith(".type")) render(true);
  }
  if (el.dataset.actFile === "img" && el.files && el.files[0]) uploadImg(el);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.path && S.editor && el.dataset.kind !== "bool") {
    const k = el.dataset.kind; let v = el.value;
    if (k === "num") v = el.value === "" ? "" : Number(el.value); else if (k === "lines") v = el.value.split("\n");
    setPath(S.editor.draft, el.dataset.path, v);
    if (el.dataset.path === "title") { const h = $("h1", $("#view")); if (h) h.textContent = el.value || "Sem título"; }
  }
  if (el.dataset.actInput === "notes") { const r = curRun(); if (r) { r.notes = el.value; saveProg(); } }
  if (el.dataset.actInput === "newsq") { S.ui.q = el.value; clearTimeout(ACT._nq); ACT._nq = setTimeout(() => { const pos = el.selectionStart; render(true); const n = $("#news-q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === "assist") { const q = $("#assist-q").value.trim(); if (q) askAssist(f.dataset.id, q); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.ui.more) { S.ui.more = false; renderChrome(); } });
async function uploadImg(el) {
  const file = el.files[0]; if (file.size > 20 * 1024 * 1024) { toast("Imagem acima de 20 MB."); return; }
  toast("Enviando imagem…");
  try { const r = await S.assets.upload(file); setPath(S.editor.draft, el.dataset.path, r.id); toast("Imagem enviada"); render(true); }
  catch (e) { toast("Não foi possível enviar a imagem."); }
}

/* ================= INICIALIZAÇÃO ================= */
async function startLocal() {
  S.mode = "local";
  if (DESK) { try { const raw = await DESK.load(); DSTORE = raw ? JSON.parse(raw) : {}; } catch (e) { DSTORE = {}; } S.prog = Object.assign(defProg(), lsGet("volter.prog", {})); }
  if (!S.prog.projects) S.prog.projects = {};
  localLoad();
  S.dbState = Object.values(S.content).some(a => a.length) ? "ok" : "none";
  if (/(^|[#&])admin\b/.test(location.hash.slice(1))) lsSet("volter.admin", true);
  S.admin = !!lsGet("volter.admin", false);
  render(true);
}
async function boot() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") { startLocal(); return; }
  S.mode = "claude"; render(true);
  const use = n => cl.use(n).catch(() => null);
  const [db, user] = await Promise.all([use("db"), use("user")]);
  S.db = db; S.user = user;
  if (user) { try { S.uid = await user.id(); S.admin = await user.canEdit(); } catch (e) {} }
  if (!db) { S.dbState = "none"; render(); }
  else {
    S.dbState = "ok";
    COLLS.forEach(t => db.collection(t).onSnapshot(snap => {
      S.content[t] = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data())); render();
    }, () => render()));
    if (S.uid) {
      try { const snap = await db.doc("data/users/" + S.uid + "/main").get();
        if (snap.exists) { const remote = Object.assign(defProg(), clone(snap.data())); if (String(remote.updatedAt) >= String(S.prog.updatedAt)) S.prog = remote; else saveProg(); S.progWhere = "conta"; }
        else if (S.prog.updatedAt) saveProg();
      } catch (e) {}
    }
    if (!S.prog.projects) S.prog.projects = {};
    render();
  }
  const [assets, sample] = await Promise.all([S.admin ? use("assets") : null, use("sample")]);
  S.assets = assets; S.sample = sample; render();
}
boot();
