<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'none'">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect x=%221%22 y=%221%22 width=%2230%22 height=%2230%22 rx=%225%22 fill=%22%233cc5dc%22/%3E%3Cpath d=%22M8 8 L16 25 L24 8%22 fill=%22none%22 stroke=%22%230b1622%22 stroke-width=%223.4%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
<title>Volter</title>
<meta name="description" content="Volter — plataforma de treinamento técnico com Bancada Virtual de diagnóstico de falhas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: barra lateral azul-marinho fixa (desktop) ou barra inferior (celular); área de trabalho com até 1180px.
   Bancada: stepper de 7 etapas no topo, ficha do caso fixa à esquerda, etapa ativa à direita. */
:root{
  --bg:#edf1f5; --surface:#ffffff; --surface-2:#e3e9ef; --ink:#0f1b2b; --muted:#536176; --line:#cdd5df;
  --side:#11233a; --side-2:#18304d; --side-ink:#e6edf5; --side-muted:#8ea3bc;
  --accent:#08869e; --accent-ink:#ffffff; --accent-soft:#d5eef3;
  --warn:#c45808; --warn-soft:#fbe6d4; --ok:#1d7f46; --ok-soft:#d8efe1; --bad:#b8352a; --bad-soft:#f7dcd9;
  --lcd:#0b1c21; --lcd-ink:#7ff0ff; --signal:#3cc5dc;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:6px; --side-w:252px; --tab-h:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0a121b; --surface:#111c28; --surface-2:#192635; --ink:#e5ecf3; --muted:#93a2b5; --line:#243447;
  --side:#0b1622; --side-2:#13243a; --side-ink:#e6edf5; --side-muted:#8399b2;
  --accent:#3cc5dc; --accent-ink:#04202a; --accent-soft:#123a45;
  --warn:#f08b3e; --warn-soft:#3a2414; --ok:#45c07c; --ok-soft:#11301f; --bad:#ee6d60; --bad-soft:#3b1916;
  --lcd:#050f12; --lcd-ink:#7ff0ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a121b; --surface:#111c28; --surface-2:#192635; --ink:#e5ecf3; --muted:#93a2b5; --line:#243447;
  --side:#0b1622; --side-2:#13243a; --side-ink:#e6edf5; --side-muted:#8399b2;
  --accent:#3cc5dc; --accent-ink:#04202a; --accent-soft:#123a45;
  --warn:#f08b3e; --warn-soft:#3a2414; --ok:#45c07c; --ok-soft:#11301f; --bad:#ee6d60; --bad-soft:#3b1916;
  --lcd:#050f12; --lcd-ink:#7ff0ff; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.08;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:2.25rem} h2{font-size:1.65rem} h3{font-size:1.22rem} h4{font-size:1.05rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:500}

/* ===== casca do app ===== */
.side{position:fixed;inset:0 auto 0 0;width:var(--side-w);background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;z-index:15;padding-top:env(safe-area-inset-top,0px);padding-left:env(safe-area-inset-left,0px);border-right:1px solid #000}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;cursor:pointer;color:inherit;padding:20px 20px 18px;text-align:left}
.brand svg{width:32px;height:32px;flex-shrink:0}
.brand b{font-family:var(--f-display);font-size:1.65rem;letter-spacing:.16em;font-weight:700;display:block;line-height:1}
.brand small{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.08em;color:var(--side-muted);text-transform:uppercase}
.snav{flex:1;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:2px}
.snav .grp{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.12em;text-transform:uppercase;color:var(--side-muted);padding:14px 10px 6px;opacity:.8}
.snav button{display:flex;align-items:center;gap:11px;background:none;border:0;color:var(--side-muted);padding:9px 10px;border-radius:5px;cursor:pointer;text-align:left;font-size:.93rem;width:100%}
.snav button svg{width:19px;height:19px;flex-shrink:0}
.snav button:hover{color:var(--side-ink);background:rgba(255,255,255,.05)}
.snav button[aria-current="page"]{color:var(--side-ink);background:var(--side-2)}
.snav button[aria-current="page"] svg{color:var(--signal)}
.snav .count{margin-left:auto;font-family:var(--f-mono);font-size:.7rem;color:var(--side-muted)}
.sfoot{padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:10px}
.lvcard{display:flex;flex-direction:column;gap:6px}
.lvcard .row1{display:flex;justify-content:space-between;align-items:baseline}
.lvcard b{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.lvcard .xp{font-family:var(--f-mono);font-size:.72rem;color:var(--side-muted)}
.xpbar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--signal)}
.sfoot .meta{font-family:var(--f-mono);font-size:.66rem;color:var(--side-muted);display:flex;justify-content:space-between;gap:8px}
.sfoot .meta button{background:none;border:0;padding:0;color:var(--side-muted);cursor:pointer;font:inherit;text-decoration:underline}

.topbar{display:none}
.wrap{margin-left:var(--side-w)}
main{max-width:1180px;margin:0 auto;padding-block:32px 72px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:26px}
.tabbar{display:none}
.sheet{display:none}

@media (max-width:960px){
  .side{display:none}
  .wrap{margin-left:0}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--side);color:var(--side-ink);align-items:center;justify-content:space-between;gap:12px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .topbar .brand{padding:4px 0}
  .topbar .brand svg{width:26px;height:26px}
  .topbar .brand b{font-size:1.35rem}
  .topbar .lv{font-family:var(--f-mono);font-size:.72rem;color:var(--side-muted);text-align:right}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:13;background:var(--side)}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px));gap:20px}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:14;background:var(--side);border-top:1px solid #000;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .tabbar button{background:none;border:0;color:var(--side-muted);display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:.68rem;cursor:pointer;min-height:var(--tab-h)}
  .tabbar button svg{width:21px;height:21px}
  .tabbar button[aria-current="page"]{color:var(--side-ink)}
  .tabbar button[aria-current="page"] svg{color:var(--signal)}
  .sheet{display:block;position:fixed;left:0;right:0;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px));z-index:14;background:var(--side);color:var(--side-ink);border-top:1px solid rgba(255,255,255,.1);padding:10px max(12px,env(safe-area-inset-right,0px)) 12px max(12px,env(safe-area-inset-left,0px));box-shadow:0 -12px 30px rgba(0,0,0,.35)}
  .sheet .snav{padding:0}
  h1{font-size:1.9rem}
}

/* ===== componentes ===== */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.stack{display:flex;flex-direction:column;gap:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}
.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.page-head .lead{max-width:64ch;color:var(--muted);margin-top:8px}
.back{background:none;border:0;padding:0;color:var(--muted);cursor:pointer;font-family:var(--f-mono);font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:inline-block}
.back:hover{color:var(--accent)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel > h3:first-child,.ph{margin-bottom:12px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ph h3{margin:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer;font-weight:500;font-size:.9rem;text-decoration:none;white-space:nowrap;min-height:38px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:.82rem;min-height:30px}

.chip{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:3px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;line-height:1.5}
.chip.demo{border-color:var(--warn);color:var(--warn)}
.chip.ok{border-color:var(--ok);color:var(--ok)}
.chip.acc{border-color:var(--accent);color:var(--accent)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.chip.st-review{color:var(--warn);border-color:var(--warn)} .chip.st-published{color:var(--ok);border-color:var(--ok)} .chip.st-archived{border-style:dashed}
.lvl{display:inline-flex;gap:2px;vertical-align:middle;align-items:flex-end}
.lvl i{width:5px;background:var(--line);border-radius:1px}
.lvl i:nth-child(1){height:6px}.lvl i:nth-child(2){height:8px}.lvl i:nth-child(3){height:10px}.lvl i:nth-child(4){height:12px}.lvl i:nth-child(5){height:14px}
.lvl i.on{background:var(--accent)}

.notice{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 4px 4px 0;font-size:.9rem}
.notice.info{border-color:var(--accent);background:var(--accent-soft)}
.notice.bad{border-color:var(--bad);background:var(--bad-soft)}
.notice.ok{border-color:var(--ok);background:var(--ok-soft)}

.list{display:flex;flex-direction:column}
.list > *{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.list > *:last-child{border-bottom:0}
.link{background:none;border:0;padding:0;color:var(--ink);text-align:left;cursor:pointer;font-weight:500;min-width:0}
.link:hover{color:var(--accent)}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;flex-wrap:wrap;background:var(--surface)}
.seg button{background:none;border:0;border-right:1px solid var(--line);padding:6px 11px;cursor:pointer;font-size:.84rem;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=search],input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:84px;resize:vertical;line-height:1.5}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:500}
label.f small{font-weight:400;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer}
label.chk input{margin-top:4px;accent-color:var(--accent)}

/* ===== painel ===== */
.hero{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:stretch}
@media (max-width:1100px){.hero{grid-template-columns:1fr}}
.hero-msg{display:flex;flex-direction:column;justify-content:center;gap:14px;padding:8px 0}
.hero-msg h1{font-size:2.9rem;font-weight:700;line-height:1}
.hero-msg h1 em{font-style:normal;color:var(--accent)}
.hero-msg p{color:var(--muted);max-width:52ch}
@media (max-width:960px){.hero-msg h1{font-size:2.2rem}}
/* ordem de serviço */
.os{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;overflow:hidden}
.os-head{background:var(--side);color:var(--side-ink);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.os-head b{color:var(--signal);font-weight:500}
.os-body{padding:16px;display:flex;flex-direction:column;gap:12px;flex:1}
.os-body h3{font-size:1.5rem}
.os dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:6px 12px;margin:0;font-size:.88rem}
.os dt{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding-top:3px}
.os dd{margin:0}
.os-foot{padding:12px 16px;border-top:1px dashed var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.stat b{font-family:var(--f-display);font-size:2rem;font-weight:600;font-variant-numeric:tabular-nums;line-height:1}
.stat .meter{height:4px;background:var(--surface-2);border-radius:2px;overflow:hidden;margin-top:6px}
.stat .meter i{display:block;height:100%;background:var(--accent)}

/* ===== cartões de caso (etiqueta de manutenção) ===== */
.tag{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;text-align:left;cursor:pointer;color:inherit;padding:0;overflow:hidden;min-width:0;transition:border-color .15s,transform .15s}
.tag:hover{border-color:var(--accent);transform:translateY(-1px)}
.tag > *{align-self:stretch;width:100%}
.tag-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 14px;background:var(--surface-2);border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tag-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}
.tag-body h3{font-size:1.28rem}
.tag-eq{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.tag-sym{font-size:.88rem;border-left:2px solid var(--line);padding-left:10px;color:var(--ink)}
.tag-foot{padding:10px 14px;border-top:1px dashed var(--line);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;text-align:left;cursor:pointer;color:inherit}
.card:hover{border-color:var(--accent)}
.card h3{font-size:1.22rem}
.card .foot{margin-top:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}

/* ===== Bancada ===== */
.stepper{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));position:relative}
.stepper::before{content:"";position:absolute;left:calc(100%/14);right:calc(100%/14);top:16px;height:2px;background:var(--line)}
.stepper .prog{position:absolute;left:calc(100%/14);top:16px;height:2px;background:var(--accent)}
.step{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);min-width:0}
.step[disabled]{cursor:default}
.step .dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font-family:var(--f-mono);font-size:.8rem;font-weight:500;color:var(--muted)}
.step.done .dot{border-color:var(--accent);color:var(--accent)}
.step.cur .dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-soft)}
.step .lb{font-family:var(--f-display);font-size:.98rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.step.cur .lb{color:var(--ink)}
@media (max-width:700px){.step .lb{display:none}.step.cur .lb{display:block;position:absolute;top:38px;white-space:nowrap;overflow:visible}.stepper{padding-bottom:22px}.step .dot{width:30px;height:30px}.stepper::before,.stepper .prog{top:14px}}
.bench{display:grid;grid-template-columns:360px minmax(0,1fr);gap:22px;align-items:start}
.bench > aside{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto}
@media (max-width:1100px){.bench{grid-template-columns:1fr}.bench > aside{position:static;max-height:none;order:2}.bench.s1 > aside{order:0}}
.ficha dl{display:flex;flex-direction:column;gap:12px;margin:0}
.ficha dt{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.ficha dd{margin:3px 0 0;font-size:.92rem}
.ficha ul,.prose ul{margin:4px 0 0;padding-left:18px}
.ficha li,.prose li{margin:3px 0}
details.fold summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-display);font-size:1.22rem;font-weight:600}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary::after{content:"+";font-family:var(--f-mono);color:var(--muted)}
details.fold[open] summary::after{content:"−"}
details.fold[open] summary{margin-bottom:12px}
.stage-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:14px}
.stage-head .n{font-family:var(--f-display);font-size:2.6rem;font-weight:700;line-height:.9;color:var(--accent);font-variant-numeric:tabular-nums}
.stage-head p{color:var(--muted);margin-top:4px;max-width:62ch}
.opt{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:4px;background:var(--surface);cursor:pointer;text-align:left;width:100%;color:inherit}
.opt:hover{border-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt input{margin-top:4px;accent-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.tests{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.test{border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.test .how{font-size:.78rem;color:var(--muted)}
.test.ran{border-color:var(--accent)}
.test.unsafe{border-color:var(--bad);background:var(--bad-soft)}
.test .tt{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.reading{font-family:var(--f-mono);background:var(--lcd);color:var(--lcd-ink);padding:6px 10px;border-radius:3px;display:inline-block;font-size:.95rem;letter-spacing:.04em;font-variant-numeric:tabular-nums;align-self:flex-start;box-shadow:inset 0 0 0 1px rgba(127,240,255,.15)}
.marks{display:flex;gap:4px;flex-wrap:wrap}
.marks button{border:1px solid var(--line);background:var(--surface);padding:4px 9px;border-radius:3px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.marks button[aria-pressed="true"].sup{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.marks button[aria-pressed="true"].wk{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.marks button[aria-pressed="true"].inc{background:var(--surface-2);color:var(--ink)}
.tools{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:16px;align-items:start}
@media (max-width:800px){.tools{grid-template-columns:1fr}}
.hintbox{border:1px dashed var(--warn);border-radius:4px;padding:10px 12px;font-size:.9rem}
.assist{display:flex;flex-direction:column;gap:10px}
.msgs{display:flex;flex-direction:column;gap:8px;max-height:320px;overflow-y:auto}
.msg{padding:8px 12px;border-radius:4px;font-size:.9rem;white-space:pre-wrap}
.msg.u{background:var(--accent-soft);align-self:flex-end;max-width:90%}
.msg.a{background:var(--surface-2)}
.score{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums}
.ring .v small{display:block;font-size:.9rem;color:var(--muted);text-align:center;margin-top:-6px;font-weight:500}
.bars{display:flex;flex-direction:column;gap:9px;flex:1;min-width:220px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 52px;gap:10px;align-items:center;font-size:.86rem}
.bar .tr{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent)}
.bar .v{font-family:var(--f-mono);font-size:.78rem;text-align:right;font-variant-numeric:tabular-nums}

/* ===== trilha ===== */
.timeline{display:flex;flex-direction:column;position:relative}
.tl-item{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:flex-start;padding:14px 0;position:relative}
.tl-item::before{content:"";position:absolute;left:19px;top:0;bottom:0;width:2px;background:var(--line)}
.tl-item:first-child::before{top:28px}.tl-item:last-child::before{bottom:calc(100% - 28px)}
.tl-dot{width:40px;height:40px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.85rem;position:relative;z-index:1;color:var(--muted)}
.tl-item.done .tl-dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tl-item.next .tl-dot{border-color:var(--accent);color:var(--accent)}
.tl-item h3{font-size:1.2rem}
.prose{max-width:68ch;display:flex;flex-direction:column;gap:12px}
.prose h3{margin-top:12px;font-size:1.35rem}
.lnav{display:flex;flex-direction:column;gap:2px}
.lnav button{display:flex;gap:10px;align-items:center;background:none;border:0;padding:7px 8px;border-radius:4px;cursor:pointer;text-align:left;color:var(--muted);font-size:.88rem}
.lnav button:hover{background:var(--surface-2);color:var(--ink)}
.lnav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.lnav .d{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-size:.66rem;flex-shrink:0}
.lnav .d.ok{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.diag{width:100%;height:auto;color:var(--ink)}
.diag-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.diag-wrap svg{min-width:620px}
.story-sec{display:grid;grid-template-columns:160px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.story-sec:first-child{border-top:0;padding-top:0}
.story-sec h4{font-family:var(--f-mono);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500;padding-top:4px}
@media (max-width:640px){.story-sec{grid-template-columns:1fr;gap:4px}}
.cover{width:100%;max-height:320px;object-fit:cover;border-radius:var(--r);border:1px solid var(--line);display:block}

/* ===== admin ===== */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--f-mono);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.fgrid .wide,.fgrid .sec{grid-column:1/-1}
.fgrid .sec{padding-top:14px;margin-top:6px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.fgrid .sec:first-child{border-top:0;margin-top:0;padding-top:0}
@media (max-width:700px){.fgrid{grid-template-columns:1fr}}
.rep{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.rep-row{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rep-row .wide{grid-column:1/-1}
@media (max-width:700px){.rep-row{grid-template-columns:1fr}}
.rep-row .rhead{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center}
.sticky-actions{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 -6px 18px rgba(0,0,0,.06)}
@media (max-width:960px){.sticky-actions{bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0px) + 8px)}}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{background:none;border:0;padding:9px 14px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:32px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:12px;align-items:center}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.badge{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.badge .ico{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);flex-shrink:0;font-family:var(--f-display);font-weight:700;font-size:.9rem}
.badge.on .ico{background:var(--accent);color:var(--accent-ink)}
.badge:not(.on){opacity:.55}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:4px;font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:960px){.toast{bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px))}}
.fav{background:none;border:1px solid var(--line);border-radius:4px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:.85rem;min-height:34px}
.fav[aria-pressed="true"]{color:var(--warn);border-color:var(--warn)}
.phase{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:16px 0;border-top:1px solid var(--line)}
.phase:first-child{border-top:0;padding-top:0}
@media (max-width:640px){.phase{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<aside class="side" aria-label="Navegação principal">
  <button class="brand" data-act="go" data-r="painel" aria-label="Volter — painel">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="5" fill="#3cc5dc"/><path d="M8 8 L16 25 L24 8" fill="none" stroke="#0b1622" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="16" cy="8" r="2.2" fill="#0b1622"/></svg>
    <span><b>VOLTER</b><small>Experiência real</small></span>
  </button>
  <nav class="snav" id="snav"></nav>
  <div class="sfoot" id="sfoot"></div>
</aside>
<div class="wrap">
  <header class="topbar">
    <button class="brand" data-act="go" data-r="painel" aria-label="Volter — painel">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="5" fill="#3cc5dc"/><path d="M8 8 L16 25 L24 8" fill="none" stroke="#0b1622" stroke-width="3.4" stroke-linejoin="round" stroke-linecap="round"/><circle cx="16" cy="8" r="2.2" fill="#0b1622"/></svg>
      <span><b>VOLTER</b></span>
    </button>
    <span class="lv" id="toplv"></span>
  </header>
  <main id="view" aria-live="polite"></main>
</div>
<div class="sheet" id="sheet" hidden></div>

<div class="toast" id="toast" hidden></div>
<script src="data/conteudo.js"></script>
<script>
"use strict";
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const clone = o => JSON.parse(JSON.stringify(o));
const arr = v => Array.isArray(v) ? v : (v ? [v] : []);
const clean = a => arr(a).map(s => String(s).trim()).filter(Boolean);
const uid8 = () => Math.random().toString(36).slice(2, 10);
const slug = s => String(s || "item").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "item";
const fmtDate = iso => { if (!iso) return ""; const d = new Date(iso.length === 10 ? iso + "T12:00:00" : iso); return isNaN(d) ? "" : d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short", year: "numeric" }); };
const getPath = (o, p) => p.split(".").reduce((a, k) => a == null ? a : a[k], o);
const setPath = (o, p, v) => { const ks = p.split("."); let a = o; ks.slice(0, -1).forEach((k, i) => { if (a[k] == null) a[k] = /^\d+$/.test(ks[i + 1]) ? [] : {}; a = a[k]; }); a[ks[ks.length - 1]] = v; };
/* armazenamento: no programa instalado (Electron) os dados vão para um arquivo com cópias diárias; no navegador, localStorage */
const DESK = window.volterDesktop || null;
let DSTORE = null, dTimer = null;
const dFlush = () => { clearTimeout(dTimer); dTimer = null; if (DESK && DSTORE) DESK.saveSync(JSON.stringify(DSTORE)); };
const lsGet = (k, d) => { if (DSTORE) return k in DSTORE ? clone(DSTORE[k]) : d; try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
const lsSet = (k, v) => { if (DSTORE) { DSTORE[k] = clone(v); clearTimeout(dTimer); dTimer = setTimeout(dFlush, 400); return; } try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const lsDel = k => { if (DSTORE) { delete DSTORE[k]; dFlush(); return; } try { localStorage.removeItem(k); } catch (e) {} };
window.addEventListener("beforeunload", () => { if (dTimer) dFlush(); });
function md(t) {
  return String(t || "").split(/\n\s*\n/).map(b => {
    const lines = b.split("\n");
    if (lines[0].startsWith("## ")) { const rest = lines.slice(1).join("\n"); return "<h3>" + inl(lines[0].slice(3)) + "</h3>" + (rest.trim() ? md(rest) : ""); }
    const out = []; let para = [], list = [];
    const flushP = () => { if (para.length) { out.push("<p>" + inl(para.join(" ")) + "</p>"); para = []; } };
    const flushL = () => { if (list.length) { out.push("<ul>" + list.map(x => "<li>" + inl(x) + "</li>").join("") + "</ul>"); list = []; } };
    lines.forEach(l => { const s = l.trim(); if (s.startsWith("- ")) { flushP(); list.push(s.slice(2)); } else if (s) { flushL(); para.push(s); } });
    flushP(); flushL(); return out.join("");
  }).join("");
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => t.hidden = true, 3200); }

/* ---------- vocabulário ---------- */
const LEVELS = [[1, "1 · Fundamentos"], [2, "2 · Comandos e manutenção"], [3, "3 · Automação industrial"], [4, "4 · Diagnóstico avançado"], [5, "5 · Casos profissionais"]];
const AREAS = ["Comandos elétricos", "Motores e acionamentos", "Automação e CLP", "Eletrônica", "Instrumentação", "Equipamentos biomédicos", "Segurança elétrica"];
const NEWS_CATS = ["Automação industrial e Indústria 4.0", "Inteligência artificial aplicada à manutenção", "Manutenção preditiva e análise de falhas", "CLPs, sensores e instrumentação", "Motores elétricos e acionamentos", "Inversores de frequência e servodrives", "Robótica industrial", "Eletrônica e sistemas embarcados", "Equipamentos biomédicos", "Segurança elétrica e normas técnicas", "Novas ferramentas, equipamentos e tecnologias", "Cursos, eventos e oportunidades de capacitação"];
const TESTVAL = [["util", "Útil — aproxima da causa"], ["neutro", "Neutro — válido, elimina pouco"], ["irrelevante", "Irrelevante — desperdício"], ["inseguro", "Inseguro — penaliza e não executa"]];
const STATUS = { draft: "Rascunho", review: "Em revisão", published: "Publicado", archived: "Arquivado" };
const STAGES = ["Investigar", "Hipóteses", "Testes", "Resultados", "Causa", "Resolver", "Aprender"];
const STAGE_TXT = ["Leia a ficha com atenção. Antes de pensar em causas: o que o equipamento deveria fazer, o que está fazendo e o que mudou?", "Selecione as causas que você considera possíveis. De duas a quatro é uma boa faixa; hipóteses demais mostram falta de foco.", "Cada teste custa tempo. Escolha os que mais separam as suas hipóteses. O resultado aparece quando você executa.", "Revise as leituras e marque, para cada hipótese, se as evidências a sustentam ou a enfraquecem.", "Com base nas evidências, qual é a causa mais provável? Ao confirmar, as etapas anteriores ficam travadas.", "Escolha a ação corretiva. Pense em segurança e em resolver a causa, não só o sintoma."];
const TYPES = { cases: { label: "Casos", one: "caso" }, stories: { label: "Histórias", one: "história" }, news: { label: "Notícias", one: "notícia" }, lessons: { label: "Lições", one: "lição" } };
const TRACK = { id: "diagnostico-eletrico", title: "Diagnóstico elétrico básico", desc: "Do método de investigação à leitura de diagramas e aos defeitos clássicos de comandos. É a base para a Bancada Virtual." };
const ROUTE_OF = { cases: "caso", stories: "historia", news: "noticias", lessons: "licao" };
const lvl = n => '<span class="lvl" title="Nível ' + n + '">' + [1, 2, 3, 4, 5].map(i => '<i class="' + (i <= n ? "on" : "") + '"></i>').join("") + "</span>";

/* ---------- estado ---------- */
const S = {
  mode: "loading", db: null, user: null, assets: null, sample: null, uid: null, admin: false,
  dbState: "loading", content: { cases: [], stories: [], news: [], lessons: [] },
  prog: null, progWhere: "local", route: { name: "painel", id: null },
  editor: null, quiz: null, assist: {}, ui: { area: "", level: 0, q: "", ncat: "", stab: "cases", sfilter: "", open: {}, more: false }, pending: false
};
function defProg() { return { v: 1, attempts: {}, runs: {}, favorites: [], lessons: {}, quick: [], recent: [], settings: { hintPenalty: true }, updatedAt: "" }; }
S.prog = Object.assign(defProg(), lsGet("volter.prog", {}));
let pushQ = Promise.resolve(), pushT = null;
function saveProg() {
  S.prog.updatedAt = new Date().toISOString();
  lsSet("volter.prog", S.prog);
  clearTimeout(pushT); pushT = setTimeout(() => { pushQ = pushQ.then(pushProg); }, 700);
}
async function pushProg() {
  if (!S.db || !S.uid || S.progWhere === "local-only") return;
  try { await S.db.doc("data/users/" + S.uid + "/main").set(clone(S.prog)); S.progWhere = "conta"; }
  catch (e) { S.progWhere = "local-only"; }
}

/* ---------- conteúdo ---------- */
const all = t => S.content[t];
const pub = t => S.content[t].filter(x => x.status === "published");
const find = (t, id) => S.content[t].find(x => x.id === id);
const visible = (t, id) => { const x = find(t, id); return x && (x.status === "published" || S.admin) ? x : null; };
function touchRecent(type, id) { const r = S.prog.recent.filter(x => !(x.type === type && x.id === id)); r.unshift({ type, id, at: new Date().toISOString() }); S.prog.recent = r.slice(0, 8); saveProg(); }
const isFav = k => S.prog.favorites.includes(k);
function favBtn(k) { const on = isFav(k); return '<button class="fav" data-act="fav" data-k="' + esc(k) + '" aria-pressed="' + on + '">' + (on ? "★ Favorito" : "☆ Favoritar") + "</button>"; }

/* modo local (GitHub Pages / arquivo aberto no navegador) */
function localLoad() {
  const seed = window.VOLTER_SEED || {}; const ov = lsGet("volter.content", {});
  ["cases", "stories", "news", "lessons"].forEach(t => {
    const base = Object.assign({}, seed[t] || {}, ov[t] || {});
    S.content[t] = Object.entries(base).filter(([, d]) => d).map(([id, d]) => Object.assign({ id }, d));
  });
}
function localWrite(t, id, doc) { const ov = lsGet("volter.content", {}); ov[t] = ov[t] || {}; ov[t][id] = doc; lsSet("volter.content", ov); }
function exportContent() {
  const out = {}; ["cases", "lessons", "stories", "news"].forEach(t => { out[t] = {}; S.content[t].forEach(x => { const d = clone(x); delete d.id; out[t][x.id] = d; }); });
  const js = "// Conteúdo do Volter — gerado pelo painel de administração em " + new Date().toLocaleString("pt-BR") + "\nwindow.VOLTER_SEED = " + JSON.stringify(out, null, 1) + ";\n";
  if (DESK && DESK.saveFile) { DESK.saveFile("conteudo.js", js).then(r => toast(r && r.saved ? "conteudo.js salvo" : "Exportação cancelada")); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([js], { type: "text/javascript" })); a.download = "conteudo.js"; document.body.appendChild(a); a.click(); a.remove();
  toast("Arquivo conteudo.js gerado");
}

/* ---------- navegação ---------- */
const NAVDEF = [
  ["", [["painel", "Painel"]]],
  ["Praticar", [["bancada", "Bancada Virtual"], ["desafios", "Desafios"]]],
  ["Estudar", [["aprender", "Aprender"], ["historias", "Histórias de Campo"], ["noticias", "Notícias Técnicas"]]],
  ["Você", [["progresso", "Meu Progresso"], ["favoritos", "Favoritos"]]]
];
const TABS = [["painel", "Painel"], ["bancada", "Bancada"], ["aprender", "Aprender"], ["progresso", "Progresso"]];
function go(name, id) { S.route = { name, id: id || null }; S.ui.more = false; window.scrollTo(0, 0); render(true); }
function navGroup() { return { caso: "bancada", correcao: "bancada", licao: "aprender", historia: "historias", editor: "admin" }[S.route.name] || S.route.name; }

/* ---------- render ---------- */
function render(force) {
  const ae = document.activeElement;
  if (!force && ae && $("#view").contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) { S.pending = true; return; }
  S.pending = false;
  renderChrome();
  let html;
  try { html = (VIEWS[S.route.name] || VIEWS.painel)(S.route.id); }
  catch (e) { console.error(e); html = '<div class="notice bad">Não foi possível abrir esta tela: ' + esc(e.message) + '</div><div><button class="btn" data-act="go" data-r="painel">Voltar ao painel</button></div>'; }
  $("#view").innerHTML = html;
}
document.addEventListener("focusout", () => setTimeout(() => { if (S.pending) render(); }, 50));
function navItems() { const g = NAVDEF.map(x => x); if (S.admin) g.push(["Gestão", [["admin", S.mode === "local" ? "Editor de conteúdo" : "Administração"]]]); return g; }
function renderChrome() {
  const grp = navGroup();
  const counts = { bancada: pub("cases").length, aprender: pub("lessons").length, favoritos: S.prog.favorites.length || "" };
  const navHTML = navItems().map(([g, items]) => (g ? '<div class="grp">' + g + "</div>" : "") + items.map(([r, l]) => '<button data-act="go" data-r="' + r + '"' + (grp === r ? ' aria-current="page"' : "") + ">" + (IC[r] || "") + "<span>" + l + "</span>" + (counts[r] ? '<span class="count">' + counts[r] + "</span>" : "") + "</button>").join("")).join("");
  $("#snav").innerHTML = navHTML;
  const xp = calcXP(), lv = levelFor(xp), pct = lv.next ? Math.round((xp - lv.min) / (lv.next[0] - lv.min) * 100) : 100;
  const modeTxt = S.mode === "local" ? (DESK ? "Programa instalado" : "Modo local") : S.mode === "claude" ? (S.admin ? "Administrador" : S.uid ? "Aluno" : "Visitante") : "Carregando";

      (next ? '<div><div style="min-width:0"><span class="eyebrow">Próxima lição</span><br><button class="link" data-act="go" data-r="licao" data-id="' + esc(next.id) + '">' + esc(next.title) + '</button></div><span class="chip">' + (next.minutes || 5) + " min</span></div>" : "") ||
      '<div><span class="muted">Nada em andamento. Comece pela ordem de serviço do dia.</span></div>') +

    '<div class="panel"><div class="ph"><h3>Publicados recentemente</h3></div><div class="list">' + (fresh.map(({ t, x }) => '<div><div style="min-width:0"><span class="eyebrow">' + TYPES[t].one + '</span><br><button class="link" data-act="open" data-t="' + t + '" data-id="' + esc(x.id) + '">' + esc(x.title) + "</button></div>" + (x.demo ? '<span class="chip demo">Demo</span>' : "") + "</div>").join("") || '<div class="muted">Sem conteúdo publicado.</div>') + "</div></div></section>";
};
function dailyCase() { const c = pub("cases").slice().sort((a, b) => a.id.localeCompare(b.id)); if (!c.length) return null; const d = Math.floor(Date.now() / 864e5); return c[d % c.length]; }

function caseCard(c) {

VIEWS.caso = id => {
  const c = visible("cases", id);
  if (!c) return dbNotice() || emptyBox("Caso não encontrado.", '<button class="btn" data-act="go" data-r="bancada">Voltar à Bancada</button>');

  if (run) return runView(c, run);
  const at = S.prog.attempts[id] || [];
  return head(caseNo(c) + " · " + esc(c.area) + " · Nível " + c.level, esc(c.title), esc(c.summary), favBtn("cases:" + id), ["bancada", "Bancada"]) +
    '<div class="bench"><aside>' + fichaHTML(c, false) + '</aside><div class="stack" style="gap:18px">' + (c.diagram === "partida-direta" ? '<div class="panel"><h3>Diagrama de comando</h3>' + diagramPartida() + "</div>" : "") +
    '<div class="panel stack"><h3>Como funciona o diagnóstico</h3><div class="stepper" aria-hidden="true">' + STAGES.map((s, i) => '<span class="step"><span class="dot">' + (i + 1) + '</span><span class="lb">' + s + "</span></span>").join("") + '</div><p class="small muted">A nota soma raciocínio (hipóteses), investigação (testes úteis), diagnóstico, solução e segurança. Testes inseguros tiram 10 pontos e cada dica tira 5.</p><div class="row"><button class="btn primary" data-act="start" data-id="' + esc(id) + '">' + (at.length ? "Refazer diagnóstico" : "Iniciar diagnóstico") + "</button>" + (at.length ? '<button class="btn" data-act="go" data-r="correcao" data-id="' + esc(id) + '">Ver correção da última tentativa</button>' : "") + "</div></div>" +
    (at.length ? '<div class="panel"><h3>Suas tentativas</h3><div class="list">' + at.slice().reverse().map(a => '<div><span class="small">' + fmtDate(a.at) + (a.unsafe ? ' · <span style="color:var(--bad)">procedimento inseguro</span>' : "") + '</span><span class="mono">' + a.score + "/100</span></div>").join("") + "</div></div>" : "") + "</div></div>";
};

function stepper(run) {
  const pct = (Math.min(run.max, 7) - 1) / 6 * (100 - 100 / 7);
  return '<div class="stepper"><span class="prog" style="width:' + pct + '%"></span>' + STAGES.map((s, i) => { const n = i + 1; const can = n <= run.max && n < 7 && !(run.locked && n < 5); return "<button " + (can ? 'data-act="stage" data-n="' + n + '"' : "disabled") + ' class="step ' + (n === run.stage ? "cur" : n <= run.max ? "done" : "") + '" aria-label="Etapa ' + n + ": " + s + '"><span class="dot">' + (n < run.stage || (n <= run.max && n !== run.stage) ? "✓" : n) + "</span><span class=\"lb\">" + s + "</span></button>"; }).join("") + "</div>";
}
function runView(c, run) {
  const st = run.stage;
  const hypMap = Object.fromEntries(arr(c.hypotheses).map(h => [h.id, h]));
  const testMap = Object.fromEntries(arr(c.tests).map(t => [t.id, t]));
  const sh = '<div class="stage-head"><span class="n">' + st + '</span><div><h2>' + STAGES[st - 1] + "</h2><p>" + STAGE_TXT[st - 1] + "</p></div></div>";
  let main = "";
  if (st === 1) {
    main = '<div class="panel">' + sh + '<div class="stack"><label class="f" for="run-notes">Anotações de campo<small>Ficam salvas com o seu progresso e aparecem ao lado durante o caso.</small><textarea id="run-notes" data-act-input="notes" rows="6" placeholder="Ex.: a falha começou depois da troca do relé…">' + esc(run.notes) + '</textarea></label><div><button class="btn primary" data-act="stage" data-n="2">Formular hipóteses →</button></div></div></div>';
  } else if (st === 2) {
    main = '<div class="panel">' + sh + '<div class="stack" style="gap:8px">' + arr(c.hypotheses).map(h => { const on = run.hyps.includes(h.id); return '<label class="opt' + (on ? " sel" : "") + '"><input type="checkbox" data-act="hyp" data-id="' + esc(h.id) + '"' + (on ? " checked" : "") + "><span>" + esc(h.text) + "</span></label>"; }).join("") + '</div><div class="row" style="margin-top:14px;justify-content:space-between"><span class="small muted">' + run.hyps.length + ' selecionada(s)</span><button class="btn primary" data-act="stage" data-n="3"' + (run.hyps.length ? "" : " disabled") + ">Escolher testes →</button></div></div>";
  } else if (st === 3) {
    main = '<div class="panel">' + sh + '<div class="tests">' + arr(c.tests).map(t => {
      const ran = run.tests.includes(t.id), unsafe = t.value === "inseguro";
      return '<div class="test' + (ran ? (unsafe ? " unsafe" : " ran") : "") + '"><div class="tt"><b>' + esc(t.name) + "</b>" + (ran ? '<span class="chip ' + (unsafe ? "bad" : "acc") + '">' + (unsafe ? "Bloqueado" : "Feito") + "</span>" : "") + '</div><div class="how">' + esc(t.how) + "</div>" +
        (ran ? (t.reading ? '<span class="reading">' + esc(t.reading) + "</span>" : "") + '<p class="small">' + esc(t.result) + "</p>" : '<div><button class="btn sm" data-act="runtest" data-id="' + esc(t.id) + '">Executar teste</button></div>') + "</div>";
    }).join("") + '</div><div class="row" style="margin-top:14px;justify-content:space-between"><span class="small muted">' + run.tests.length + " de " + arr(c.tests).length + ' testes executados</span><button class="btn primary" data-act="stage" data-n="4"' + (run.tests.length ? "" : " disabled") + ">Analisar resultados →</button></div></div>";
  } else if (st === 4) {

async function askAssist(caseId, q) {
  const c = find("cases", caseId), run = S.prog.runs[caseId];
  if (!c || !S.sample) return;
  const a = S.assist[caseId] || (S.assist[caseId] = { msgs: [], busy: false });
  a.msgs.push({ role: "user", content: q }); a.busy = true; a.err = ""; render(true);
  const hyp = arr(c.hypotheses).filter(h => run && run.hyps.includes(h.id)).map(h => "- " + h.text).join("\n") || "(nenhuma ainda)";
  const tests = arr(c.tests).filter(t => run && run.tests.includes(t.id)).map(t => "- " + t.name + ": " + t.result).join("\n") || "(nenhum ainda)";
  const sys = "Você é o Volter Assist, tutor de diagnóstico de manutenção elétrica e industrial da plataforma educacional Volter. O aluno está resolvendo um caso na Bancada Virtual.\n" +
    "Regras: 1) Ensine o raciocínio; NÃO revele qual é a causa nem a ação correta, mesmo se pedirem. 2) Não invente especificações de fabricante, códigos de falha ou valores de medição; use só os dados do caso. 3) Diferencie fatos do caso, hipóteses e sugestões. 4) Se faltar informação, diga o que falta. 5) Segurança em primeiro lugar: bloqueio e etiquetagem, verificação de ausência de tensão, EPI, habilitação; nunca oriente jumpear proteções ou intervir energizado sem habilitação. 6) Responda em português do Brasil, em no máximo 150 palavras, em texto simples sem markdown.\n\n" +
    "CASO: " + c.title + "\nEquipamento: " + c.equipment + "\nContexto: " + c.context + "\nSintomas: " + arr(c.symptoms).join(" | ") + "\nHistórico: " + c.history + "\nQuando acontece: " + c.conditions + "\nInformações técnicas: " + arr(c.techInfo).join(" | ") +
    "\nHipóteses escolhidas pelo aluno:\n" + hyp + "\nTestes já executados e resultados:\n" + tests + "\nEtapa atual: " + (run ? STAGES[run.stage - 1] : "-");
  const msgs = a.msgs.map((m, i) => ({ role: m.role, content: i === 0 ? sys + "\n\nPERGUNTA DO ALUNO: " + m.content : m.content }));
  try {
    const res = await S.sample(msgs, { cache: false, onText: ({ text }) => { const box = $("#msgs"); if (box) { let el = $("#live", box); if (!el) { el = document.createElement("div"); el.id = "live"; el.className = "msg a"; box.appendChild(el); } el.textContent = text; box.scrollTop = box.scrollHeight; } } });
    a.msgs.push({ role: "assistant", content: res.text });
  } catch (e) {
    a.msgs.pop(); a.err = e && e.code === "not_granted" ? "O assistente não foi autorizado nesta visualização." : e && e.code === "rate_limited" ? "Muitas perguntas seguidas. Aguarde um pouco e tente de novo." : "Não foi possível obter resposta agora. Tente de novo em instantes.";
  }
  a.busy = false; render(true);
  const box = $("#msgs"); if (box) box.scrollTop = box.scrollHeight;
}

function scoreRun(c, run) {
  const correctHyp = arr(c.hypotheses).filter(h => h.correct).map(h => h.id);
  let hyp = run.hyps.some(id => correctHyp.includes(id)) ? 20 : 5; hyp -= Math.max(0, run.hyps.length - 3) * 3; hyp = Math.max(0, Math.min(20, hyp));
  const tests = arr(c.tests), used = tests.filter(t => run.tests.includes(t.id));
  const need = Math.max(1, Math.min(3, tests.filter(t => t.value === "util").length));
  const u = used.filter(t => t.value === "util").length, irr = used.filter(t => t.value === "irrelevante").length, neu = used.filter(t => t.value === "neutro").length;
  let inv = 30 * Math.min(1, u / need) - irr * 4 - Math.max(0, neu - 2); inv = Math.max(0, Math.min(30, Math.round(inv)));
  const cause = arr(c.causes).find(k => k.id === run.cause), action = arr(c.actions).find(k => k.id === run.action);
  const diag = cause && cause.correct ? 30 : 0, sol = action && action.correct ? 20 : 0;
  const unsafe = used.filter(t => t.value === "inseguro").length + (action && action.unsafe ? 1 : 0);
  const hintPen = S.prog.settings.hintPenalty ? run.hints * 5 : 0;
  return { score: Math.max(0, Math.min(100, hyp + inv + diag + sol - unsafe * 10 - hintPen)), parts: { hyp, inv, diag, sol, seg: unsafe ? 0 : 100 }, unsafe, hintPen };
}
function ring(v) { const r = 54, c = 2 * Math.PI * r; return '<div class="ring"><svg viewBox="0 0 132 132" aria-hidden="true"><circle cx="66" cy="66" r="' + r + '" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="66" cy="66" r="' + r + '" fill="none" stroke="' + (v >= 70 ? "var(--accent)" : v >= 40 ? "var(--warn)" : "var(--bad)") + '" stroke-width="12" stroke-linecap="round" stroke-dasharray="' + (c * v / 100).toFixed(1) + " " + c.toFixed(1) + '"/></svg><div class="v"><div>' + v + "<small>de 100</small></div></div></div>"; }

function quizQ(q, chosen, kind, ref, qi, noNum) {

    let cls = ""; if (answered) { if (oi === ans) cls = " right"; else if (oi === chosen) cls = " wrong"; }
    return '<button class="opt' + cls + '" ' + (answered ? "disabled" : 'data-act="' + kind + '" data-ref="' + esc(ref) + '" data-qi="' + qi + '" data-oi="' + oi + '"') + "><span>" + esc(o) + "</span></button>";
  }).join("") + "</div>" + (answered ? '<p class="small"><b>' + (chosen === ans ? "Certo." : "Não é essa.") + "</b> " + esc(q.explain) + "</p>" : "") + "</div>";

/* ----- Progresso ----- */
function calcXP() { let x = 0; for (const id in S.prog.attempts) { const a = S.prog.attempts[id]; if (a.length) x += Math.max(...a.map(t => t.score)); } for (const id in S.prog.lessons) if (S.prog.lessons[id].done) x += 20; return x; }
const LV = [[0, "Aprendiz"], [150, "Auxiliar"], [400, "Técnico"], [800, "Técnico sênior"], [1400, "Especialista"]];
function levelFor(x) { let r = LV[0]; LV.forEach(l => { if (x >= l[0]) r = l; }); const i = LV.indexOf(r); return { name: r[1], min: r[0], next: LV[i + 1] }; }
function avgBest() { const b = Object.values(S.prog.attempts).filter(a => a.length).map(a => Math.max(...a.map(t => t.score))); return b.length ? Math.round(b.reduce((s, v) => s + v, 0) / b.length) : "—"; }
VIEWS.progresso = () => {
  const xp = calcXP(), lv = levelFor(xp);
  const atts = Object.entries(S.prog.attempts).flatMap(([id, a]) => a.map(t => Object.assign({ id }, t)));
  const comp = k => { const v = atts.map(a => a.parts[k] / ({ hyp: 20, inv: 30, diag: 30, sol: 20, seg: 100 })[k]); return v.length ? Math.round(v.reduce((s, x) => s + x, 0) / v.length * 100) : 0; };
  const ls = trackLessons(); const allDone = ls.length && ls.every(l => S.prog.lessons[l.id] && S.prog.lessons[l.id].done);
  const last = {}; atts.forEach(a => last[a.id] = a);
  const badges = [["1º", "Primeiro diagnóstico", "Concluiu um caso na Bancada", atts.length > 0], ["IN", "Investigador eficiente", "Investigação com 90% ou mais", atts.some(a => a.parts.inv >= 27)], ["SG", "Sem atalhos", "3 casos sem procedimento inseguro", Object.values(last).filter(a => !a.unsafe).length >= 3], ["SD", "Sem dicas", "Acertou a causa sem pedir dica", atts.some(a => !a.hints && a.parts.diag)], ["TR", "Trilha concluída", TRACK.title, !!allDone], ["5/5", "Treino perfeito", "5 de 5 no treino rápido", S.prog.quick.some(q => q.score === q.total && q.total >= 5)]];
  const recCase = pub("cases").find(c => !S.prog.attempts[c.id]); const recLesson = ls.find(l => !(S.prog.lessons[l.id] && S.prog.lessons[l.id].done));
  const weak = ["hyp", "inv", "diag", "sol"].map(k => [k, comp(k)]).sort((a, b) => a[1] - b[1])[0];
  const weakTip = { hyp: "Treine a formulação de hipóteses: releia a lição “O método do diagnóstico”.", inv: "Escolha testes que separam hipóteses. Reveja “Tensão, corrente e continuidade”.", diag: "Antes de confirmar a causa, use o comparador de hipóteses na etapa 4.", sol: "Na etapa 6, prefira ações que resolvem a causa, não o sintoma." }[weak[0]];
  const where = S.mode === "local" ? (DESK ? "Seu progresso fica salvo neste computador, com uma cópia automática por dia." : "Seu progresso fica salvo neste navegador.") : S.progWhere === "conta" ? "Seu progresso está salvo na sua conta e acompanha você em outros dispositivos." : S.uid && S.progWhere !== "local-only" ? "Sincronizando com a sua conta…" : "Seu progresso está salvo apenas neste navegador.";
  return head("Área do aluno", "Meu Progresso", where) +
    '<section class="stats"><div class="stat"><span class="eyebrow">Nível</span><b>' + lv.name + '</b><span class="small muted">' + (lv.next ? (lv.next[0] - xp) + " XP para " + lv.next[1] : "Nível máximo") + '</span><div class="meter"><i style="width:' + (lv.next ? Math.round((xp - lv.min) / (lv.next[0] - lv.min) * 100) : 100) + '%"></i></div></div><div class="stat"><span class="eyebrow">Experiência</span><b>' + xp + '</b><span class="small muted">XP</span></div><div class="stat"><span class="eyebrow">Tentativas</span><b>' + atts.length + '</b></div><div class="stat"><span class="eyebrow">Lições</span><b>' + Object.values(S.prog.lessons).filter(l => l.done).length + "</b></div></section>" +
    '<div class="split"><div class="stack" style="gap:18px"><div class="panel"><h3>Competências</h3>' + (atts.length ? '<div class="bars">' + [["Raciocínio", "hyp"], ["Investigação", "inv"], ["Diagnóstico", "diag"], ["Solução", "sol"], ["Segurança", "seg"]].map(([l, k]) => { const v = comp(k); return '<div class="bar"><span>' + l + '</span><span class="tr"><i style="width:' + v + '%"></i></span><span class="v">' + v + "%</span></div>"; }).join("") + "</div>" : '<p class="muted small">Conclua um caso na Bancada para ver suas competências.</p>') + "</div>" +
    '<div class="panel"><h3>Distintivos</h3><div class="badges">' + badges.map(([ic, t, d, on]) => '<div class="badge' + (on ? " on" : "") + '"><span class="ico">' + ic + '</span><div><b class="small">' + t + '</b><div class="small muted">' + d + "</div></div></div>").join("") + "</div></div>" +
    '<div class="panel"><h3>Histórico</h3><div class="list">' + (atts.sort((a, b) => b.at.localeCompare(a.at)).slice(0, 12).map(a => { const c = find("cases", a.id); return '<div><div style="min-width:0"><button class="link" data-act="go" data-r="correcao" data-id="' + esc(a.id) + '">' + esc(c ? c.title : a.id) + '</button><div class="small muted">' + fmtDate(a.at) + (a.unsafe ? " · procedimento inseguro" : "") + '</div></div><span class="mono">' + a.score + "/100</span></div>"; }).join("") || '<div class="muted small">Nenhuma tentativa ainda.</div>') + "</div></div></div>" +

    '<div class="panel stack"><h3>Preferências</h3><label class="chk"><input type="checkbox" id="pref-hint" data-act="pref" data-k="hintPenalty"' + (S.prog.settings.hintPenalty ? " checked" : "") + '> Descontar 5 pontos por dica</label><p class="small muted">Desligue para estudar sem pressão. A nota continua mostrando quantas dicas foram usadas.</p></div></div></div>';
};

function validate(t, d) {
  const e = [];
  if (!String(d.title || "").trim()) e.push("Informe o título.");
  if (t === "cases") {
    if (!arr(d.hypotheses).filter(h => String(h.text).trim()).length) e.push("Cadastre pelo menos uma hipótese.");
    if (!arr(d.hypotheses).some(h => h.correct)) e.push("Marque a hipótese que corresponde à causa real.");
    if (!arr(d.tests).filter(x => String(x.name).trim() && String(x.result).trim()).length) e.push("Cadastre pelo menos um teste com resultado.");
    if (arr(d.causes).filter(c => c.correct).length !== 1) e.push("Marque exatamente uma causa como correta.");
    if (!arr(d.actions).some(a => a.correct)) e.push("Marque pelo menos uma ação como correta.");
  }
  if (t === "lessons") arr(d.questions).forEach((q, i) => { const n = q.type === "vf" ? 2 : clean(q.options).length; if (!String(q.prompt).trim()) e.push("Exercício " + (i + 1) + ": falta o enunciado."); if (!(q.answer >= 1 && q.answer <= n)) e.push("Exercício " + (i + 1) + ": a resposta correta deve ser um número de 1 a " + n + "."); });
  if (t === "news" && d.url && !/^https?:\/\//.test(d.url)) e.push("O link da fonte deve começar com http:// ou https://.");
  if (t === "news" && !d.demo && !String(d.sourceName).trim()) e.push("Notícias reais precisam da fonte original. Se for um exemplo, marque “Exemplo”.");
  return e;
}
function normalize(t, d) {
  const x = clone(d);
  const linesKeys = { cases: ["symptoms", "techInfo", "hints", "solution.logic", "solution.mistakes", "solution.lessons"], stories: ["checklist"], lessons: ["keypoints"], news: [] }[t];
  linesKeys.forEach(k => setPath(x, k, clean(getPath(x, k))));
  ["tags", "keywords"].forEach(k => { if (k in x) x[k] = (Array.isArray(x[k]) ? x[k] : String(x[k]).split(",")).map(s => String(s).trim()).filter(Boolean); });
  if (t === "cases") { ["hypotheses", "causes", "actions"].forEach(k => x[k] = arr(x[k]).filter(r => String(r.text).trim())); x.tests = arr(x.tests).filter(r => String(r.name).trim()); x.level = Number(x.level) || 1; }
  if (t === "lessons") { x.questions = arr(x.questions).filter(q => String(q.prompt).trim()).map(q => Object.assign(q, { options: q.type === "vf" ? ["Verdadeiro", "Falso"] : clean(q.options), answer: Number(q.answer) })); x.order = Number(x.order) || 0; x.minutes = Number(x.minutes) || 5; x.track = x.track || TRACK.id; }
  delete x.id;
  return x;
}
async function saveEditor(status) {
  const E = S.editor; if (!E || E.saving) return;
  E.errors = status === "draft" ? (String(E.draft.title || "").trim() ? [] : ["Informe o título."]) : validate(E.t, E.draft);
  if (E.errors.length) { render(true); return; }
  if (S.mode !== "local" && !S.db) { E.errors = ["O banco de dados não está disponível nesta visualização."]; render(true); return; }
  const now = new Date().toISOString(), prev = E.id ? find(E.t, E.id) : null;
  const doc = normalize(E.t, E.draft);
  doc.status = status; doc.updatedAt = now; doc.createdAt = prev && prev.createdAt || now; doc.author = prev && prev.author || S.uid || "";
  doc.history = arr(prev && prev.history).concat(prev && prev.status === status ? [] : [{ status, at: now }]).slice(-12);
  const id = E.id || (slug(doc.title) + "-" + uid8().slice(0, 4));
  E.saving = true; render(true);
  try {
    if (S.mode === "local") localWrite(E.t, id, doc); else await S.db.doc(E.t + "/" + id).set(doc);
    if (E.t === "cases" && doc.storyId) { const st = find("stories", doc.storyId); if (st && st.caseId !== id) { if (S.mode === "local") { const s2 = clone(st); delete s2.id; s2.caseId = id; localWrite("stories", st.id, s2); st.caseId = id; } else await S.db.doc("stories/" + doc.storyId).update({ caseId: id }).catch(() => {}); } }
    E.id = id; E.saving = false; E.errors = [];
    const ix = S.content[E.t].findIndex(x => x.id === id); const row = Object.assign({ id }, doc); if (ix >= 0) S.content[E.t][ix] = row; else S.content[E.t].push(row);
    toast({ draft: "Rascunho salvo", review: "Enviado para revisão", published: "Publicado", archived: "Arquivado" }[status] + (S.mode === "local" ? (DESK ? " neste computador" : " neste navegador") : "")); render(true);
  } catch (e) { E.saving = false; E.errors = [e && e.code === "invalid_argument" ? "Sua conta não tem permissão para alterar o conteúdo." : e && e.code === "quota_exceeded" ? "Limite de armazenamento atingido: " + e.message : "Não foi possível salvar agora. Tente de novo."]; render(true); }
}

  toggle: el => { S.ui.open[el.dataset.k] = !S.ui.open[el.dataset.k]; render(true); },
  fav: el => { const k = el.dataset.k, f = S.prog.favorites, i = f.indexOf(k); if (i >= 0) f.splice(i, 1); else f.push(k); saveProg(); toast(i >= 0 ? "Removido dos favoritos" : "Salvo nos favoritos"); render(true); },
  start: el => { const id = el.dataset.id; S.prog.runs[id] = { stage: 1, max: 1, hyps: [], tests: [], marks: {}, cause: null, action: null, hints: 0, notes: "", locked: false, started: new Date().toISOString() }; touchRecent("cases", id); saveProg(); go("caso", id); },
  abandon: el => { delete S.prog.runs[el.dataset.id]; saveProg(); go("caso", el.dataset.id); },
  stage: el => { const r = curRun(); if (!r) return; const n = Number(el.dataset.n); r.stage = n; r.max = Math.max(r.max, n); saveProg(); window.scrollTo(0, 0); render(true); },
  hyp: el => { const r = curRun(); if (!r || r.locked) return; const id = el.dataset.id; r.hyps = r.hyps.includes(id) ? r.hyps.filter(x => x !== id) : r.hyps.concat(id); saveProg(); render(true); },
  runtest: el => { const r = curRun(); if (!r) return; const id = el.dataset.id; if (!r.tests.includes(id)) r.tests.push(id); const c = find("cases", S.route.id); const t = arr(c.tests).find(x => x.id === id); if (t && t.value === "inseguro") toast("Procedimento inseguro registrado: −10 pontos"); saveProg(); render(true); },
  mark: el => { const r = curRun(); if (!r) return; r.marks[el.dataset.id] = r.marks[el.dataset.id] === el.dataset.v ? "" : el.dataset.v; saveProg(); render(true); },
  pick: el => { const r = curRun(); if (!r) return; if (el.dataset.f === "cause" && r.locked) return; r[el.dataset.f] = el.dataset.id; saveProg(); render(true); },
  lockcause: () => { const r = curRun(); if (!r || !r.cause) return; r.locked = true; r.stage = 6; r.max = 6; saveProg(); window.scrollTo(0, 0); render(true); },
  hint: () => { const r = curRun(); if (!r) return; r.hints++; saveProg(); render(true); },
  finish: () => { const id = S.route.id, r = curRun(), c = find("cases", id); if (!r || !c || !r.action) return; const sc = scoreRun(c, r); const at = { at: new Date().toISOString(), score: sc.score, parts: sc.parts, unsafe: sc.unsafe, hints: r.hints, hintPen: sc.hintPen, hyps: r.hyps, tests: r.tests, cause: r.cause, action: r.action }; (S.prog.attempts[id] = S.prog.attempts[id] || []).push(at); S.prog.attempts[id] = S.prog.attempts[id].slice(-10); delete S.prog.runs[id]; saveProg(); go("correcao", id); },
  lq: el => { const id = el.dataset.ref, qi = Number(el.dataset.qi), oi = Number(el.dataset.oi); const l = find("lessons", id); const p = S.prog.lessons[id] || (S.prog.lessons[id] = { answers: {}, done: false, score: 0 }); p.answers[qi] = oi; const qs = arr(l.questions); if (qs.every((q, i) => p.answers[i] != null)) { p.done = true; p.score = qs.filter((q, i) => p.answers[i] === Number(q.answer) - 1).length; toast("Lição concluída"); } touchRecent("lessons", id); saveProg(); render(true); },
  resetlesson: el => { delete S.prog.lessons[el.dataset.id]; saveProg(); render(true); },
  quizstart: () => { const pool = questionPool().sort(() => Math.random() - .5).slice(0, 5); S.quiz = { qs: pool, i: 0, answers: {} }; render(true); },
  qq: el => { S.quiz.answers[Number(el.dataset.qi)] = Number(el.dataset.oi); render(true); },
  quiznext: () => { const q = S.quiz; q.i++; if (q.i >= q.qs.length) { const sc = q.qs.filter((it, i) => q.answers[i] === Number(it.q.answer) - 1).length; S.prog.quick.push({ at: new Date().toISOString(), score: sc, total: q.qs.length }); S.prog.quick = S.prog.quick.slice(-30); saveProg(); } render(true); },
  quizclose: () => { S.quiz = null; render(true); },
  pref: el => { S.prog.settings[el.dataset.k] = el.checked; saveProg(); render(true); },
  new: el => startEditor(el.dataset.t),
  edit: el => startEditor(el.dataset.t, el.dataset.id),
  etab: el => { S.editor.tab = el.dataset.v; render(true); },
  save: el => saveEditor(el.dataset.s),
  delask: () => { S.editor.confirmDel = true; render(true); },
  delcancel: () => { S.editor.confirmDel = false; render(true); },
  delitem: async () => { const E = S.editor; try { if (S.mode === "local") localWrite(E.t, E.id, null); else await S.db.doc(E.t + "/" + E.id).delete(); S.content[E.t] = S.content[E.t].filter(x => x.id !== E.id); toast("Excluído"); S.editor = null; go("admin"); } catch (e) { E.errors = ["Não foi possível excluir."]; E.confirmDel = false; render(true); } },
  repadd: el => { const p = el.dataset.path; const a = arr(getPath(S.editor.draft, p)); a.push(SUBBLANK[p.split(".").pop()]()); setPath(S.editor.draft, p, a); render(true); },
  repdel: el => { const p = el.dataset.path; const a = arr(getPath(S.editor.draft, p)); a.splice(Number(el.dataset.i), 1); setPath(S.editor.draft, p, a); render(true); },
  repmove: el => { const p = el.dataset.path, i = Number(el.dataset.i), j = i + Number(el.dataset.d); const a = arr(getPath(S.editor.draft, p)); [a[i], a[j]] = [a[j], a[i]]; render(true); },
  rmimg: el => { setPath(S.editor.draft, el.dataset.path, ""); render(true); },
  export: () => exportContent(),
  resetlocal: el => { if (el.dataset.confirm !== "1") { el.dataset.confirm = "1"; el.textContent = "Clique de novo para confirmar"; el.classList.add("danger"); return; } lsDel("volter.content"); localLoad(); toast("Alterações locais descartadas"); render(true); },
  tocase: el => { const s = find("stories", el.dataset.id); if (!s) return; startEditor("cases"); const d = S.editor.draft; const lines = t => String(t || "").split(/\n|\.\s+/).map(x => x.trim()).filter(Boolean);
    Object.assign(d, { title: "Desafio: " + s.title, area: AREAS.includes(s.category) ? s.category : AREAS[0], source: s.kind === "campo" ? "campo" : "didatico", demo: s.kind !== "campo", summary: s.summary, context: s.context, symptoms: lines(s.symptoms), hypotheses: lines(s.firstHypotheses).map(t => ({ id: "h" + uid8(), text: t, correct: false })).concat([{ id: "h" + uid8(), text: s.rootCause, correct: true }]), causes: [{ id: "c" + uid8(), text: s.rootCause, correct: true }], actions: [{ id: "a" + uid8(), text: s.solution, correct: true, unsafe: false, feedback: "" }], storyId: s.id, solution: { explanation: [s.rootCause, s.solution].filter(Boolean).join(" "), logic: lines(s.tests), mistakes: lines(s.difficulties), lessons: lines(s.lessons) } });
    toast("Rascunho criado a partir da história. Complete os testes e as alternativas."); render(true); },
  noop: () => {}
};
function curRun() { return S.route.name === "caso" ? S.prog.runs[S.route.id] : null; }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act; if (!ACT[a]) return;
  if (el.tagName === "INPUT" && el.type === "checkbox" && a === "pref") return;
  e.preventDefault(); ACT[a](el);
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "pref") { ACT.pref(el); return; }
  if (el.dataset.path && S.editor) {
    const k = el.dataset.kind; let v = el.value;
    if (k === "bool") v = el.checked; else if (k === "num") v = el.value === "" ? "" : Number(el.value); else if (k === "lines") v = el.value.split("\n");
    setPath(S.editor.draft, el.dataset.path, v);
    if (el.tagName === "SELECT" && el.dataset.path.endsWith(".type")) render(true);
  }
  if (el.dataset.actFile === "img" && el.files && el.files[0]) uploadImg(el);
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.path && S.editor && el.dataset.kind !== "bool") {
    const k = el.dataset.kind; let v = el.value;
    if (k === "num") v = el.value === "" ? "" : Number(el.value); else if (k === "lines") v = el.value.split("\n");
    setPath(S.editor.draft, el.dataset.path, v);
    if (el.dataset.path === "title") { const h = $("h1", $("#view")); if (h) h.textContent = el.value || "Sem título"; }
  }
  if (el.dataset.actInput === "notes") { const r = curRun(); if (r) { r.notes = el.value; saveProg(); } }
  if (el.dataset.actInput === "newsq") { S.ui.q = el.value; clearTimeout(ACT._nq); ACT._nq = setTimeout(() => { const pos = el.selectionStart; render(true); const n = $("#news-q"); if (n) { n.focus(); n.setSelectionRange(pos, pos); } }, 250); }
});
document.addEventListener("submit", e => {
  const f = e.target; e.preventDefault();
  if (f.dataset.form === "assist") { const q = $("#assist-q").value.trim(); if (q) askAssist(f.dataset.id, q); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.ui.more) { S.ui.more = false; renderChrome(); } });
async function uploadImg(el) {
  const file = el.files[0]; if (file.size > 20 * 1024 * 1024) { toast("Imagem acima de 20 MB."); return; }
  toast("Enviando imagem…");
  try { const r = await S.assets.upload(file); setPath(S.editor.draft, el.dataset.path, r.id); toast("Imagem enviada"); render(true); }
  catch (e) { toast("Não foi possível enviar a imagem."); }
}

/* ================= INICIALIZAÇÃO ================= */
async function startLocal() {
  S.mode = "local";
  if (DESK) { try { const raw = await DESK.load(); DSTORE = raw ? JSON.parse(raw) : {}; } catch (e) { DSTORE = {}; } S.prog = Object.assign(defProg(), lsGet("volter.prog", {})); }
  localLoad();
  S.dbState = Object.values(S.content).some(a => a.length) ? "ok" : "none";
  if (/(^|[#&])admin\b/.test(location.hash.slice(1))) lsSet("volter.admin", true);
  S.admin = !!lsGet("volter.admin", false);
  render(true);
}
async function boot() {
  const cl = window.claude;
  if (!cl || typeof cl.use !== "function") { startLocal(); return; }
  S.mode = "claude"; render(true);
  const use = n => cl.use(n).catch(() => null);
  const [db, user] = await Promise.all([use("db"), use("user")]);
  S.db = db; S.user = user;
  if (user) { try { S.uid = await user.id(); S.admin = await user.canEdit(); } catch (e) {} }
  if (!db) { S.dbState = "none"; render(); }
  else {
    S.dbState = "ok";
    ["cases", "stories", "news", "lessons"].forEach(t => db.collection(t).onSnapshot(snap => {
      S.content[t] = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data())); render();
    }, () => render()));
    if (S.uid) {
      try { const snap = await db.doc("data/users/" + S.uid + "/main").get();
        if (snap.exists) { const remote = Object.assign(defProg(), clone(snap.data())); if (String(remote.updatedAt) >= String(S.prog.updatedAt)) S.prog = remote; else saveProg(); S.progWhere = "conta"; }
        else if (S.prog.updatedAt) saveProg();
      } catch (e) {}
    }
    render();
  }
  const [assets, sample] = await Promise.all([S.admin ? use("assets") : null, use("sample")]);
  S.assets = assets; S.sample = sample; render();
}
boot();
</script>
